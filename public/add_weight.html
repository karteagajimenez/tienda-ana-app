<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Gestión de Pedidos</title>

<style>

.acciones-pedido {
    white-space: nowrap;
}
.paginacion-clientes {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;

    padding: 14px 0;
    margin: 0;

    background: #fdf6f0;

    font-weight: bold;
    color: #555;

    z-index: 900;
}

.paginacion-clientes button {
    background: #b76e8a;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.paginacion-clientes button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

body {
    font-family: Arial;
    background: linear-gradient(to right, #f8e1e7, #fdf6f0);
    margin: 0;
}

/* HEADER */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 25px;
    
}

.header h1 {
    font-size: 22px;
    color: #c48b9f;
    margin: 0;
}

/* LOGO MÁS GRANDE */
.logo-container {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}

.logo {
    height: 90px;
}

/* BOTONES HEADER */
.header-buttons button {
    background: #b76e8a;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
    margin-left: 8px;
    font-weight: bold;
}

/* BOTÓN CERRAR SESIÓN ROJO */
.header-buttons button:last-child {
    background: #e74c3c;
}

.header-buttons button:hover {
    opacity: 0.85;
}
/* =========================================================
   MENÚ LATERAL IZQUIERDO
========================================================= */

.menu-movil {
    position: fixed;
    top: 0;
    left: 0;

    width: 0;
    height: 100vh;

    background: #efd0da;

    overflow:  hidden;

    transition: width 0.3s ease;

    z-index: 5000;

    box-shadow: 2px 0 8px rgba(0,0,0,0.08);
}


/* MENÚ ABIERTO */

.menu-movil.abierto {
    width: 255px;
}


/* BOTÓN ☰ */

#botonMenuMovil {
    position:  absolute;

    top: 28px;
    left: 18px;

    z-index: 6000;

    width: 42px;
    height: 42px;

    padding: 0;
    margin: 0;

    border: none;

    background: transparent;

    color: #b76e8a;

    font-size: 30px;
    font-weight: normal;
    line-height: 1;

    cursor: pointer;
}
/* ESPACIO PARA EL BOTÓN ☰ ANTES DEL TÍTULO */

.header h1 {
    margin-left: 45px;
}


/* CUANDO EL MENÚ ESTÁ ABIERTO */

.menu-movil.abierto #botonMenuMovil {
    position: absolute;
}


/* CONTENIDO DEL MENÚ */

#menuMovilOpciones {
    display: flex;

    flex-direction: column;

    gap: 10px;

    width: 100%;

    margin: 0;

    padding: 15px 12px;

    box-sizing: border-box;

    background: transparent;

    border: none;
    box-shadow: none;

    overflow: visible;

    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}


/* LOGO */

.cabecera-menu-movil {
    width: 100%;
    height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    padding: 0;

    box-sizing: border-box;
}

.logo-menu-movil {
    width: 82px;
    height: auto;

    border-radius: 10px;
}


/* BOTONES */

#menuMovilOpciones button {
    width: 100%;

    margin: 0;

    padding: 10px 12px;

    border: none;
    border-radius: 7px;

    background: #c48b9f;
    color: white;

    font-size: 14px;
    font-weight: normal;

    text-align: center;

    cursor: pointer;
}

#menuMovilOpciones button:hover {
    opacity: 0.88;

    transform: translateX(2px);
}
/* BUSCADOR */
#buscar {
    width: 100%;
    max-width: 500px;
    padding: 12px;
    margin: 20px auto;
    display: block;
    border: 1px solid #ccc;
    border-radius: 6px;
}

/* TABLA */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

th {
    background: #c48b9f;
    color: white;
}

/* BOTONES */
td button {
    border: none;
    padding: 8px 13px;
    border-radius: 6px;
    cursor: pointer;
    margin: 2px;
    font-weight: bold;
}

/* COLORES */
.peso {
    background: #a85c78;
    color: white;
}

.pago {
    background: #2ecc71;
    color: white;
}

.estado {
    background: #c48b9f;
    color: white;
}

.eliminar {
    background: #e74c3c;
    color: white;
}

.detalles {
    background: #b76e8a;
    color: white;
}
.editar {
    background: #5dade2;
    color: white;
}

.archivar {
    background: #f5b041;
    color: white;
}

/* SALDO */
.saldo-pendiente {
    color: #e74c3c;
    font-weight: bold;
}

.saldo-pagado {
    color: #2ecc71;
    font-weight: bold;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 340px;
    min-height: 230px;
    text-align: center;
    box-sizing: border-box;
}


.modal input,
.modal select {
    width: 95%;
    height: 52px;
    padding: 12px;
    margin: 10px auto;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
}

.modal button {
    padding: 8px 12px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.ok {
    background: #2ecc71;
    color: white;
}

.cancel {
    background: #95a5a6;
    color: white;
}

/* =========================================================
   BUSCADOR DE ARTÍCULOS - EDITAR PEDIDO
========================================================= */

#editarBuscadorContenedor {
    position: relative;
    width: 95%;
    margin: 10px auto;
}

#editarBuscarArticulo {
    width: 100%;
    height: 52px;
    padding: 12px;
    margin: 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
}

#editarListaArticulos {
    position: absolute;
    top: calc(100% + 3px);
    left: 0;
    width: 100%;
    background: white;
    border: 1px solid #e2c3ce;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    max-height: 220px;
    overflow-y: auto;
    z-index: 2000;
    display: none;
    box-sizing: border-box;
    text-align: left;
}

#editarListaArticulos.mostrar {
    display: block;
}

#editarListaArticulos .opcion-buscador {
    padding: 11px 14px;
    cursor: pointer;
    border-bottom: 1px solid #f3e8ec;
}

#editarListaArticulos .opcion-buscador:last-child {
    border-bottom: none;
}

#editarListaArticulos .opcion-buscador:hover {
    background: #f8e1e7;
}

#editarListaArticulos .nombre-articulo-lista {
    font-weight: bold;
    color: #444;
}

#editarListaArticulos .descripcion-articulo-lista {
    margin-top: 4px;
    font-size: 12px;
    color: #888;
    line-height: 1.4;
}

#editarListaArticulos .sin-resultados {
    padding: 12px;
    color: #888;
    font-size: 13px;
    text-align: center;
}

/* MENSAJE PEQUEÑO DE AVISO */
#mensajeAviso {
    display: none;
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    color: #444;
    padding: 14px 22px;
    border-radius: 8px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.20);
    border-left: 5px solid #e74c3c;
    z-index: 5000;
    font-size: 15px;
    max-width: 430px;
    text-align: center;

}
/* =========================================================
   BOTONES EXCLUSIVOS DEL MENÚ EN CELULAR
========================================================= */

.solo-celular-menu {
    display: none !important;
}
 @media (max-width: 768px) {

    /* =========================================================
       PÁGINA

    }

        background: linear-gradient(

    -webkit-overflow-scrolling: touch;

}
    /* =========================================================

    #buscar {

    body > table {

    [id^="detalle-cliente-"] > td {

    /* BOTONES DE ACCIÓN */

    [id^="contenido-cliente-"] td button {

    }


/* =========================================================
   AJUSTE DEL ENCABEZADO EN CELULAR

.header h1 {
    margin-left: 55px;
}

   POSICIÓN DEL LOGO DENTRO DEL MENÚ EN CELULAR
========================================================= */

    padding-top: 55px;
}

    height: 105px;

.logo-menu-movil {
    width: 90px;
    height: auto;
}

    display: block !important;

}

}
/* DETALLE A TODO EL ANCHO SIN ENSANCHAR LA LISTA */

    [id^="detalle-cliente-"] > td {
        padding: 0;
        overflow: visible;
    }

    [id^="contenido-cliente-"] {
        position: relative;
        width: 100vw;

    .zona-superior-fija .barra-cliente-fija {
        width: 800px;

        margin-left: auto;
        margin-right: auto;
        border-radius: 10px 10px 0 0;
        overflow: hidden;
        box-shadow: 0 -1px 10px rgba(0, 0, 0, 0.10);
    }


    body > table.tabla-clientes-compacta {
        table-layout: fixed;
        width: 800px;

}

        #fdf6f0
    );

}

}

}

    }

</div>

</table>

function traducirEstado(estado){

    switch(estado){

            return "Estados Unidos";

        case "COLOMBIA":
            return "Colombia";
        case "COMPRADO":
            return "Comprado";

        case "ENTREGADO":

        default:

}

function traducirPaisOrigen(pais){

            return pais || "-";

    }

}



/* =========================================================
   FORMATEAR DINERO
========================================================= */

function moneda(valor){

    return "₡" +
        Number(valor || 0)
        .toLocaleString(
            "es-CR",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        ).replace(/[\u00A0\u202F ]/g, ".");

}



/* =========================================================
   OBTENER CLAVE DEL GRUPO
========================================================= */

function obtenerClaveGrupo(pedido){

    /*
        PEDIDOS NUEVOS

        Utilizan grupo_compra real.
    */

    if(
        pedido.grupo_compra !== null &&
        pedido.grupo_compra !== undefined &&
        Number(pedido.grupo_compra) > 0
    ){

        return String(
            pedido.grupo_compra
        );

    }


    /*
        PEDIDOS ANTIGUOS

        Si todavía no tienen grupo_compra,
        los dejamos separados para evitar
        mezclar facturas antiguas por accidente.
    */

    return `legacy-${pedido.id_pedido}`;

}

function obtenerClientesAbiertos(){

                            ""
                        )
                    );

                abiertos.push(
                    idUsuario
                );

            }

        }
    );

    return abiertos;
}

async function cargarPedidos(){

    
    try{

        const clientesAbiertos =
          obtenerClientesAbiertos();
          
        const res =
            await fetch("/orders");


        const data =
            await res.json();


        pedidosGlobales =
            data;


        pedidosPorCliente =
            {};



        /* =================================================
           AGRUPAR PRIMERO POR CLIENTE
           Y DESPUÉS POR FACTURA / GRUPO
        ================================================= */

        data.forEach(p => {


            const idUsuario =
                Number(
                    p.id_usuario
                );


            if(!pedidosPorCliente[idUsuario]){


                pedidosPorCliente[idUsuario] = {

                    id_usuario:
                        idUsuario,

                    nombre:
                        p.nombre,

                    apellido:
                        p.apellido,

                    grupos:
                        {}

                };

            }



            const cliente =
                pedidosPorCliente[
                    idUsuario
                ];



            const claveGrupo =
                obtenerClaveGrupo(p);



            if(!cliente.grupos[claveGrupo]){


                cliente.grupos[
                    claveGrupo
                ] = {

                    clave:
                        claveGrupo,

                    grupo_compra:
                        Number(
                            p.grupo_compra
                        ) > 0
                            ? Number(
                                p.grupo_compra
                            )
                            : null,

                    numero_factura:
                        Number(
                            p.numero_factura
                        ) > 0
                            ? Number(
                                p.numero_factura
                            )
                            : null,

                    pais_origen:
                        p.pais_origen ||
                        (
                            p.estado ===
                            "COLOMBIA"
                                ? "COLOMBIA"
                                : "EEUU"
                        ),

                    peso_total:
                        0,

                    envio_total:
                        0,

                    total_abonado:
                        0,

                    fecha_abono:
                        null,

                    estados:
                        new Set(),

                    pedidos:
                        []

                };

            }



            const grupo =
                cliente.grupos[
                    claveGrupo
                ];



            /* =================================================
               GUARDAR PEDIDO
            ================================================= */

            grupo.pedidos.push(
                p
            );



            /* =================================================
               PESO
            ================================================= */

            const peso =
                Number(
                    p.peso_gramos
                ) || 0;


            grupo.peso_total +=
                peso;



            /* =================================================
               ENVÍO
            ================================================= */

            const pesoRedondeado =
                Math.floor(peso / 100) * 100 + ((peso % 100) < 25 ? 0 : (peso % 100) <= 55 ? 50 : 100);

            const envio =
                (pesoRedondeado / 1000) *
                6000;


            grupo.envio_total +=
                envio;



            /* =================================================
               ABONOS
            ================================================= */

            grupo.total_abonado +=
                Number(
                    p.total_abonado
                ) || 0;



            /* =================================================
               ESTADO
            ================================================= */

            if(p.estado){

                grupo.estados.add(
                    p.estado
                );

            }



            /* =================================================
               FECHA MÁS RECIENTE
            ================================================= */

            if(p.fecha_abono){


                const fecha =
                    p.fecha_abono
                    .split("T")[0];


                if(
                    !grupo.fecha_abono ||
                    fecha >
                    grupo.fecha_abono
                ){

                    grupo.fecha_abono =
                        fecha;

                }

            }


        });



        /* =================================================
           SI ESTAMOS VIENDO UN CLIENTE
           Y YA NO TIENE PEDIDOS ACTIVOS,
           VOLVER A LA LISTA DE CLIENTES
        ================================================= */

        if(
            clienteVistaActual &&
            !pedidosPorCliente[
                clienteVistaActual
            ]
        ){

            clienteVistaActual =
                null;

        }
/* =================================================

        /* =================================================

function renderizarVista(){

setTimeout(

function obtenerClientesFiltrados(){

    const buscar =
        document.getElementById(
            "buscar"
        );

    const valor =
        buscar
            ? buscar.value
                .toLowerCase()
                .trim()
            : "";

    return Object.values(
        pedidosPorCliente
    )
    .filter(
        cliente => {

            const nombreCompleto =
                `${cliente.nombre} ${cliente.apellido}`
                .toLowerCase();

            return nombreCompleto.includes(
                valor
            );
        }
    )
    .sort(
        (a, b) => {

            const facturasA =
                Object.values(a.grupos)
                .map(grupo =>
                    Number(grupo.grupo_compra)
                )
                .filter(numero =>
                    Number.isFinite(numero) &&
                    numero > 0
                );

            const facturasB =
                Object.values(b.grupos)
                .map(grupo =>
                    Number(grupo.grupo_compra)
                )
                .filter(numero =>
                    Number.isFinite(numero) &&
                    numero > 0
                );

            const facturaA =
                facturasA.length > 0
                    ? Math.min(...facturasA)
                    : Number.MAX_SAFE_INTEGER;

            const facturaB =
                facturasB.length > 0
                    ? Math.min(...facturasB)
                    : Number.MAX_SAFE_INTEGER;

            return facturaA - facturaB;
        }
    );
}
/* =========================================================

function mostrarListaClientes(){

        <tr>
            <th style="
                width:110px;

                padding-left:16px;
            ">
                Cliente
            </th>
        </tr>
    `;

    let html = "";

    const clientes =
        obtenerClientesFiltrados();

    const inicio =
        (paginaActual - 1) *
        clientesPorPagina;

    const fin =
        inicio +
        clientesPorPagina;

    const clientesPagina =
        clientes.slice(
            inicio,
            fin
        );

    if(clientes.length === 0){

        html = `
            <tr>
                <td colspan="2">
                    No hay pedidos activos.
                </td>
            </tr>
        `;
    }

    clientesPagina.forEach(
        cliente => {

            const grupos =
                Object.values(
                    cliente.grupos
                );

            const gruposConFactura =
                grupos
                .filter(
                    grupo =>
                        Number(
                            grupo.grupo_compra
                        ) > 0
                )
                .sort(
                    (a, b) =>
                        Number(a.grupo_compra) -
                        Number(b.grupo_compra)
                );

            const grupoPrincipal =
                gruposConFactura.length > 0
                    ? gruposConFactura[0]
                    : null;

            let numeroFactura = "-";
            let claseFactura = "";

            if(grupoPrincipal){

                numeroFactura =
                    grupoPrincipal.numero_factura;

                const subtotalProductos =
                    grupoPrincipal.pedidos.reduce(
                        (total, pedido) =>
                            total +
                            (
                                Number(
                                    pedido.total_precio
                                ) || 0
                            ),
                        0
                    );

                const totalFactura =
                    subtotalProductos +
                    (
                        Number(
                            grupoPrincipal.envio_total
                        ) || 0
                    );

                const saldo =
                    totalFactura -
                    (
                        Number(
                            grupoPrincipal.total_abonado
                        ) || 0
                    );

                claseFactura =
                    saldo > 0
                        ? "saldo-pendiente"
                        : "saldo-pagado";
            }

            html += `
                <tr
                    style="cursor:pointer;"
                    onclick="toggleCliente(
                        ${cliente.id_usuario}
                    )"
                >

                        class="${claseFactura}"

                            width:110px;
                            text-align:center;
                            font-weight:bold;
                            border-right:2px solid #d8d8d8;

                    <td style="text-align:left; padding-left:45px;">

                        <strong>
                            <span id="flecha-${cliente.id_usuario}">

                            ${cliente.nombre}
                            ${cliente.apellido}
                        </strong>

                    </td>

                </tr>

                    id="detalle-cliente-${cliente.id_usuario}"
                    style="display:none;"
                >

                    <td colspan="2">

                        <div
                            id="contenido-cliente-${cliente.id_usuario}"
                        >
                        </div>

                    </td>

                </tr>
            `;
        }
    );

    document.getElementById(
        "tablaPedidos"
    ).innerHTML =
        html;

    document.getElementById(
        "buscar"
    ).placeholder =
        "Buscar cliente...";

    actualizarPaginacion();

    /* Alinear exactamente la raya del encabezado con la raya de Factura */
    requestAnimationFrame(() => {

        const celdaFactura =
            document.querySelector("#tablaPedidos tr td:first-child");

        const encabezadoFactura =
            document.querySelector(".barra-cliente-fija > div:first-child");

        if(celdaFactura && encabezadoFactura){

            const barra =
                document.querySelector(".barra-cliente-fija");

            const posicion =
                celdaFactura.getBoundingClientRect().right -
                barra.getBoundingClientRect().left;

            encabezadoFactura.style.width =
                `${posicion}px`;

            encabezadoFactura.style.minWidth =
                `${posicion}px`;

            encabezadoFactura.style.maxWidth =
                `${posicion}px`;
        }

    });
}
/* =========================================================
   PAGINACIÓN - CLIENTES
========================================================= */

function actualizarPaginacion(){

const clientes =
    obtenerClientesFiltrados();

    const totalClientes =
        clientes.length;

    const inicio =
        (paginaActual - 1) *
        clientesPorPagina;

    const fin =
        Math.min(
            inicio + clientesPorPagina,
            totalClientes
        );

    const texto =
        document.getElementById(
            "textoPaginacion"
        );

    const anterior =
        document.getElementById(
            "btnAnterior"
        );

    const siguiente =
        document.getElementById(
            "btnSiguiente"
        );


   if(totalClientes === 0){

    texto.textContent =
        "0 de 0";

    anterior.style.visibility =
        "hidden";

    siguiente.style.visibility =
        "hidden";

    return;
     }


    texto.textContent =
        `${inicio + 1} - ${fin} de ${totalClientes}`;

anterior.style.visibility =
    paginaActual === 1
        ? "hidden"
        : "visible";


siguiente.style.visibility =
    fin >= totalClientes
        ? "hidden"
        : "visible";
}
function paginaAnterior(){

    if(paginaActual <= 1){
        return;
    }

    paginaActual--;

    mostrarListaClientes();
}


function paginaSiguiente(){

    const clientes =
        obtenerClientesFiltrados();

    const totalClientes =
        clientes.length;

    const totalPaginas =
        Math.ceil(
            totalClientes /
            clientesPorPagina
        );

    if(paginaActual >= totalPaginas){
        return;
    }

    paginaActual++;

    mostrarListaClientes();
}


function toggleTodosClientes(){

    const boton =
        document.getElementById(
            "btnExpandir"
        );

    const botonMovil =
        document.getElementById(
            "btnExpandirMenuMovil"
        );

    const filasDetalle =
        document.querySelectorAll(
            '[id^="detalle-cliente-"]'
        );

    const textoBoton =
        boton
            ? boton.textContent.trim()
            : (
                botonMovil
                    ? botonMovil.textContent.trim()
                    : "Expandir"
            );

    const abrirTodos =
        textoBoton.includes("Expandir");


    filasDetalle.forEach(
        fila => {

            const idUsuario =
                fila.id.replace(
                    "detalle-cliente-",
                    ""
                );

            const flecha =
                document.getElementById(
                    `flecha-${idUsuario}`
                );


            if(abrirTodos){

                fila.style.display =
                    "table-row";

                if(flecha){
                    flecha.textContent =
                        "▼";
                }

                mostrarFacturasCliente(
                    Number(idUsuario),
                    true
                );

            }else{

                fila.style.display =
                    "none";

                if(flecha){
                    flecha.textContent =
                        "▶";
                }

            }

        }
    );


    if(boton){

        boton.textContent =
            abrirTodos
                ? "↙️ Colapsar"
                : "↗️ Expandir";

    }


    if(botonMovil){

        botonMovil.textContent =
            abrirTodos
                ? "↙️ Colapsar"
                : "↗️ Expandir";

    }

}

function abrirModal(
    tipoOperacion,
    idUsuario,
    grupoCompra
){

    tipo =
        tipoOperacion;


    clienteSeleccionado =
        Number(idUsuario);


    grupoSeleccionado =
        Number(grupoCompra);


    pedidoId =
        null;


    const cliente =
        pedidosPorCliente[
            clienteSeleccionado
        ];


    if(!cliente){

        mostrarMensaje(
            "No se encontró el cliente"
        );

        return;

    }


    const grupo =
        cliente.grupos[
            String(grupoSeleccionado)
        ];


    if(!grupo){

        mostrarMensaje(
            "No se encontró la factura seleccionada"
        );

        return;

    }


    const modal =
        document.getElementById(
            "modal"
        );


    const titulo =
        document.getElementById(
            "titulo"
        );


    const pedidoSelect =
        document.getElementById(
            "pedidoSelect"
        );


    const inputValor =
        document.getElementById(
            "inputValor"
        );


    const metodoPago =
        document.getElementById(
            "metodoPago"
        );


    const estadoSelect =
        document.getElementById(
            "estadoSelect"
        );

    const btnEditarAbono =
         document.getElementById(
         "btnEditarAbono"
        );


    modal.style.display =
        "flex";


    inputValor.value =
        "";


    metodoPago.value =
        "";


    estadoSelect.value =
        "";


    pedidoSelect.style.display =
        "block";


    inputValor.style.display =
        "none";


    metodoPago.style.display =
        "none";


    estadoSelect.style.display =
        "none";

    btnEditarAbono.style.display =
      "none";

    /* =====================================================
       CARGAR SOLO ARTÍCULOS DE ESTA FACTURA
    ===================================================== */

    let opciones = `

        <option value="">
            Seleccione artículo
        </option>

    `;


    grupo.pedidos.forEach(
        pedido => {

            opciones += `

                <option
                    value="${pedido.id_pedido}"
                >

                    ${pedido.articulo}
                    - Cantidad ${pedido.cantidad}

                </option>

            `;

        }
    );


    pedidoSelect.innerHTML =
        opciones;

/* =====================================================
   PESO
===================================================== */
if(tipo === "peso"){

    titulo.innerText =
        "Peso general";


    pedidoSelect.style.display =
        "none";


    inputValor.style.display =
        "block";


    inputValor.placeholder =
        "Digite el peso en gramos";


    /* =========================================
       GUARDAR INTERNAMENTE EL PESO GENERAL
       EN EL PRIMER PEDIDO DE LA FACTURA
    ========================================= */

    if(
        grupo.pedidos &&
        grupo.pedidos.length > 0
    ){

        pedidoId =
            grupo.pedidos[0].id_pedido;

    }


    btnEditarAbono.style.display =
        "inline-block";

}
    /* =====================================================
       ABONO
    ===================================================== */
if(tipo === "pago"){

    titulo.innerText =
        "Abono general";


    /* NO MOSTRAR ARTÍCULOS */

    pedidoSelect.style.display =
        "none";


    /* USAR INTERNAMENTE EL PRIMER PEDIDO
       DE ESTA FACTURA */

    if(
        grupo.pedidos &&
        grupo.pedidos.length > 0
    ){

        pedidoId =
            grupo.pedidos[0].id_pedido;

    }


    inputValor.style.display =
        "block";


    inputValor.placeholder =
        "Monto general";


    metodoPago.style.display =
        "block";


    btnEditarAbono.style.display =
        "inline-block";

}
    /* =====================================================
       ESTADO
    ===================================================== */

    if(tipo === "estado"){

        titulo.innerText =
            "Cambie el estado de esta factura";


        pedidoSelect.style.display =
            "none";


        estadoSelect.style.display =
            "block";

    }


    /* =====================================================
       ELIMINAR
    ===================================================== */

    if(tipo === "eliminar"){

        titulo.innerText =

    }

async function abrirEditarAbono(){

    const modal =
        document.getElementById(
            "modalEditarAbono"
        );

    const inputMontoViejo =
        document.getElementById(
            "editarAbonoViejo"
        );

    const inputMontoNuevo =
        document.getElementById(
            "editarAbonoMonto"
        );

    const labelAbonoViejo =
        document.getElementById(
            "labelAbonoViejo"
        );

    const labelAbonoNuevo =
        document.getElementById(
            "labelAbonoNuevo"
        );


    const cliente =
        pedidosPorCliente[
            clienteSeleccionado
        ];


    if(!cliente){

        mostrarMensaje(
            "No se encontró el cliente"
        );

        return;
    }


    const grupo =
        cliente.grupos[
            String(grupoSeleccionado)
        ];


    if(
        !grupo ||
        !grupo.pedidos ||
        grupo.pedidos.length === 0
    ){

        mostrarMensaje(
            "No se encontró la factura seleccionada"
        );

        return;
    }


    try{

        /*
            BUSCAR LOS ABONOS DE TODOS
            LOS PEDIDOS DE ESTA FACTURA
        */

        const respuestas =
            await Promise.all(

                grupo.pedidos.map(
                    pedido =>
                        fetch(
                            `/payments/${pedido.id_pedido}`
                        )
                )

            );


        const todosLosAbonos =
            [];


        for(
            const respuesta of respuestas
        ){

            if(!respuesta.ok){
                continue;
            }


            const data =
                await respuesta.json();


            if(
                data.ok &&
                Array.isArray(data.abonos)
            ){

                todosLosAbonos.push(
                    ...data.abonos
                );

            }

        }


        /*
            SI LA FACTURA NO TIENE ABONOS
        */

        if(
            todosLosAbonos.length === 0
        ){

            mostrarMensaje(
                "Esta factura no tiene abonos registrados"
            );

            return;
        }


        /*
            ORDENAR DEL MÁS RECIENTE
            AL MÁS ANTIGUO.

            id_abono es autoincremental,
            por eso el id más alto corresponde
            al último abono registrado.
        */

        todosLosAbonos.sort(
            (a, b) =>
                Number(b.id_abono) -
                Number(a.id_abono)
        );


        const ultimoAbono =
            todosLosAbonos[0];


        /*
            GUARDAR INTERNAMENTE
            EL ABONO QUE SE VA A EDITAR
        */

        modal.dataset.idAbono =
            ultimoAbono.id_abono;


        /*
            MOSTRAR MONTO ACTUAL
        */

        inputMontoViejo.value =
            Number(
                ultimoAbono.monto_abono
            ) || 0;


        inputMontoNuevo.value =
            "";


        labelAbonoViejo.style.display =
            "block";

        inputMontoViejo.style.display =
            "block";


        labelAbonoNuevo.style.display =
            "block";

        inputMontoNuevo.style.display =
            "block";


        modal.style.display =
            "flex";


    }catch(error){

        console.error(
            "Error cargando abono:",
            error
        );

        mostrarMensaje(
            "No se pudo cargar el abono"
        );

    }

}

function normalizarArticuloEditar(texto){

    return String(
        texto || ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .trim();

}

function mostrarArticulosEditar(filtro = ""){

    const listaArticulos =
        document.getElementById(
            "editarListaArticulos"
        );

    const buscar =
        normalizarArticuloEditar(
            filtro
        );


    const resultados =
        articulosEditar.filter(
            articulo =>

                normalizarArticuloEditar(
                    articulo.nombre
                ).includes(buscar)
        );


    listaArticulos.innerHTML = "";


    if(resultados.length === 0){

        listaArticulos.innerHTML = `
            <div class="sin-resultados">
                No se encontraron artículos guardados.
            </div>
        `;

        listaArticulos.classList.add(
            "mostrar"
        );

        return;

    }


    resultados.forEach(articulo => {

        const opcion =
            document.createElement("div");


        opcion.className =
            "opcion-buscador";


        const nombre =
            document.createElement("div");


        nombre.className =
            "nombre-articulo-lista";


        nombre.textContent =
            articulo.nombre || "";


        opcion.appendChild(nombre);


        if(articulo.descripcion){

            const descripcion =
                document.createElement("div");


            descripcion.className =
                "descripcion-articulo-lista";


            descripcion.textContent =
                articulo.descripcion;


            opcion.appendChild(
                descripcion
            );

        }


        opcion.addEventListener(
            "mousedown",
            (e) => {

                e.preventDefault();

                seleccionarArticuloEditar(
                    articulo
                );

            }
        );


        listaArticulos.appendChild(
            opcion
        );

    });


    listaArticulos.classList.add(
        "mostrar"
    );

}

let clienteParaArchivar = null;
let grupoParaArchivar = null;


function archivarCliente(
    idUsuario,
    grupoCompra
){

    const cliente =
        pedidosPorCliente[
            Number(idUsuario)
        ];


    if(!cliente){

        mostrarMensaje(
            "No se encontró el cliente"
        );

        return;

    }


    const grupo =
        cliente.grupos[
            String(
                Number(grupoCompra)
            )
        ];


    if(!grupo){

        mostrarMensaje(
            "No se encontró la factura seleccionada"
        );

        return;

    }


    clienteParaArchivar =
        Number(idUsuario);


    grupoParaArchivar =
        Number(grupoCompra);


    document.getElementById(
        "mensajeArchivar"
    ).textContent =
        `¿Desea archivar esta factura de ${cliente.nombre} ${cliente.apellido}?`;


    document.getElementById(
        "modalArchivar"
    ).style.display =
        "flex";

}



function cancelarArchivar(){

    clienteParaArchivar =
        null;


    grupoParaArchivar =
        null;


    document.getElementById(
        "modalArchivar"
    ).style.display =
        "none";

}



async function confirmarArchivar(){

    if(
        !clienteParaArchivar ||
        !grupoParaArchivar
    ){

        return;

    }


    const idUsuario =
        clienteParaArchivar;


    const grupoCompra =
        grupoParaArchivar;


    try{

        const respuesta =
            await fetch(
                "/archive-client-orders",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        id_usuario:
                            idUsuario,

                        grupo_compra:
                            grupoCompra

                    })
                }
            );


        const resultado =
            await respuesta.json();


        if(
            !respuesta.ok ||
            !resultado.ok
        ){

            mostrarMensaje(
                resultado.mensaje ||
                "No se pudo archivar la factura"
            );

            return;

        }


        cancelarArchivar();

        await cargarPedidos();

        const clienteActualizado =
            pedidosPorCliente[Number(idUsuario)];

        if (
            clienteActualizado &&
            Object.keys(clienteActualizado.grupos || {}).length > 0
        ) {
            mostrarFacturasCliente(Number(idUsuario), true);
        } else {
            cerrarModalDetalleCliente();
        }

        mostrarMensaje(
            "Factura archivada exitosamente",
            "exito"
        );


    }catch(error){

        console.error(
            "Error archivando factura:",
            error
        );


        mostrarMensaje(
            "Error al archivar la factura"
        );

    }

}

<script>

const clienteParaReabrir =
    sessionStorage.getItem(
        "reabrirGestionCliente"
    );

if(clienteParaReabrir){

    sessionStorage.removeItem(
        "reabrirGestionCliente"
    );

    const idClienteReabrir =
        Number(clienteParaReabrir);

    if(
        Number.isInteger(idClienteReabrir) &&
        idClienteReabrir > 0 &&
        pedidosPorCliente[idClienteReabrir]
    ){
        toggleCliente(
            idClienteReabrir
        );
    }
}

function cerrarModalDetalleCliente(){

    const modal =
        document.getElementById(
            "modalDetalleCliente"
        );

    if(!modal){
        return;
    }

    const idUsuario =
        modal.dataset.clienteId;

    if(idUsuario){

        const flecha =
            document.getElementById(
                `flecha-${idUsuario}`
            );

        if(flecha){
            flecha.textContent = "▶";
        }

        const contenedorViejo =
            document.getElementById(
                `contenido-cliente-antiguo-${idUsuario}`
            );

        if(contenedorViejo){
            contenedorViejo.id =
                `contenido-cliente-${idUsuario}`;
        }
    }

    const contenidoModal =
        document.getElementById(
            "contenidoModalDetalleCliente"
        );

    if(contenidoModal){
        contenidoModal.innerHTML = "";
    }

    delete modal.dataset.clienteId;

    modal.classList.remove("abierto");
}


/* =========================================================
   MENSAJE VISUAL
========================================================= */
function mostrarMensaje(texto, tipo = "error"){

    let mensaje = document.getElementById("mensajeGlobal");

    if(!mensaje){
        mensaje = document.createElement("div");
        mensaje.id = "mensajeGlobal";

        mensaje.style.position = "fixed";
        mensaje.style.top = "25px";
        mensaje.style.left = "50%";
        mensaje.style.transform = "translateX(-50%)";
        mensaje.style.zIndex = "10000";
        mensaje.style.color = "#ffffff";
        mensaje.style.padding = "12px 22px";
        mensaje.style.borderRadius = "8px";
        mensaje.style.fontSize = "15px";
        mensaje.style.fontWeight = "600";
        mensaje.style.boxShadow = "0 4px 14px rgba(0,0,0,0.25)";
        mensaje.style.maxWidth = "calc(100% - 40px)";
        mensaje.style.textAlign = "center";

        document.body.appendChild(mensaje);
    }

    const esExito =
        tipo === "exito";

    mensaje.style.background =
        esExito
            ? "#28a745"
            : "#d62828";

    mensaje.textContent = texto;
    mensaje.style.display = "block";

    clearTimeout(window.temporizadorMensajeGlobal);

    window.temporizadorMensajeGlobal = setTimeout(() => {
        mensaje.style.display = "none";
    }, 2500);
}

</script>
