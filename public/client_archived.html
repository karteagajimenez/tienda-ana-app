<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archivos Cliente - Tienda Ana</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fdf6f0,
                    #f8e1e7
                );

            color: #4b3f42;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px;
        }


        #header {

            width: 100%;
            max-width: 1200px;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            padding: 15px 20px;

            background-color: #fffaf8;

            border: 1px solid #f2d5dd;

            border-radius: 12px;

            box-shadow:
                0 4px 12px rgba(150, 90, 110, 0.12);

            margin-bottom: 30px;
        }


        #nombreCliente {

            font-weight: bold;

            font-size: 16px;

            color: #714f5b;

            margin-right: 20px;
        }


        #volver {

            background-color: #c48b9f;

            color: white;

            border: none;

            padding: 9px 17px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            margin-right: 10px;

            transition:
                background-color 0.3s,
                transform 0.2s;
        }


        #volver:hover {

            background-color: #b3748a;

            transform: translateY(-1px);
        }


        #cerrarSesion {

            background-color: #d95c68;

            color: white;

            border: none;

            padding: 9px 17px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition:
                background-color 0.3s,
                transform 0.2s;
        }


        #cerrarSesion:hover {

            background-color: #c94c59;

            transform: translateY(-1px);
        }


        .tabla-container {

            width: 100%;
            max-width: 1200px;

            background-color: #fffaf8;

            border: 1px solid #f1d4dc;

            border-radius: 12px;

            box-shadow:
                0 5px 18px rgba(150, 90, 110, 0.13);

            padding: 20px;
        }


        .titulo-seccion {

            margin-bottom: 15px;

            color: #714f5b;

            font-size: 20px;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 10px;

            overflow: hidden;
        }


        th,
        td {

            padding: 13px 15px;

            text-align: left;
        }


        th {

            background-color: #d990a4;

            color: white;

            font-weight: 600;

            font-size: 14px;
        }


        td {

            background-color: #fffdfc;

            border-bottom: 1px solid #f3e3e7;

            font-size: 14px;

            color: #55494d;
        }


        tbody tr:hover td {

            background-color: #fff4f6;
        }


        .estado {

            padding: 5px 10px;

            border-radius: 12px;

            font-size: 12px;

            font-weight: 600;

            color: white;

            display: inline-block;
        }


        .En_EEUU {
            background-color: #3498db;
        }


        .COLOMBIA {
            background-color: #e67e22;
        }


        .EN_CAMINO {
            background-color: #f39c12;
        }


        .COSTA_RICA {
            background-color: #8e44ad;
        }


        .EMPACADO {
            background-color: #16a085;
        }


        .ENTREGADO {
            background-color: #27ae60;
        }


        .sin-pedidos {

            text-align: center;

            color: #9a7d85;

            padding: 30px;

            font-size: 15px;
        }


        @media(max-width:700px){

            body {

                padding: 10px;
            }


            #header {

                flex-wrap: wrap;

                gap: 10px;
            }


            .tabla-container {

                overflow-x: auto;
            }


            table {

                min-width: 750px;
            }

        }

    </style>

</head>


<body>


<div id="header">

    <span id="nombreCliente">

        👤 Cargando cliente...

    </span>


    <button id="volver">

        Volver

    </button>


    <button id="cerrarSesion">

        Cerrar sesión

    </button>

</div>


<div class="tabla-container">

    <h2 class="titulo-seccion">

        Facturas archivadas

    </h2>


    <table>

        <thead>

            <tr>

                <th>
                    Artículo
                </th>

                <th>
                    Cantidad
                </th>

                <th>
                    Precio
                </th>

                <th>
                    Envío
                </th>

                <th>
                    Abono
                </th>

                <th>
                    País de origen
                </th>

                <th>
                    Estado del paquete
                </th>

            </tr>

        </thead>


        <tbody id="tabla">

        </tbody>

    </table>

</div>


<script>


// ========================================
// OBTENER ID DEL CLIENTE
// ========================================

const params =
    new URLSearchParams(
        window.location.search
    );

const id =
    params.get("id");


// ========================================
// TRADUCIR PAÍS
// ========================================

function traducirPaisOrigen(pais){

    switch(pais){

        case "EEUU":
            return "Estados Unidos";

        case "COLOMBIA":
            return "Colombia";

        default:
            return "-";

    }

}


// ========================================
// TRADUCIR ESTADO
// ========================================

function traducirEstado(e){

    switch(e){

        case "En_EEUU":

            return {
                texto: "Estados Unidos",
                clase: "En_EEUU"
            };


        case "COLOMBIA":

            return {
                texto: "Colombia",
                clase: "COLOMBIA"
            };


        case "EN_CAMINO":

            return {
                texto: "En camino",
                clase: "EN_CAMINO"
            };


        case "COSTA_RICA":

            return {
                texto: "Costa Rica",
                clase: "COSTA_RICA"
            };


        case "EMPACADO":

            return {
                texto: "Empacado",
                clase: "EMPACADO"
            };


        case "ENTREGADO":

            return {
                texto: "Entregado",
                clase: "ENTREGADO"
            };


        default:

            return {
                texto: e || "-",
                clase: ""
            };

    }

}


// ========================================
// CARGAR NOMBRE DEL CLIENTE
// ========================================

async function cargarNombreCliente(){

    try{

        const respuesta =
            await fetch(
                `/user/${id}`
            );

        const usuario =
            await respuesta.json();

        const nombre =
            usuario.nombre || "";

        const apellido =
            usuario.apellido || "";

        const nombreCompleto =
            `${nombre} ${apellido}`.trim();


        document.getElementById(
            "nombreCliente"
        ).innerText =
            nombreCompleto
                ? "👤 " + nombreCompleto
                : "👤 Cliente";


    }catch(error){

        console.error(
            "Error cargando nombre:",
            error
        );

    }

}


// ========================================
// CARGAR PEDIDOS ARCHIVADOS
// ========================================

async function cargarArchivados(){

    try{

        const res =
            await fetch(
                `/client-archived-orders/${id}`
            );


        const data =
            await res.json();


        let html = "";


        if(data.length === 0){

            html = `

                <tr>

                    <td
                        colspan="7"
                        class="sin-pedidos"
                    >

                        No tienes facturas archivadas.

                    </td>

                </tr>

            `;

        }


        data.forEach(p => {


            const cantidad =
                Number(
                    p.cantidad
                ) || 0;


            const precioUnitario =
                Number(
                    p.precio_unidad
                ) || 0;


            const precioProducto =
                precioUnitario *
                cantidad;


            const envio =
                (
                    (p.peso_gramos || 0)
                    / 1000
                )
                * 6000;


            const paisOrigen =
                traducirPaisOrigen(
                    p.pais_origen
                );


            const estado =
                traducirEstado(
                    p.estado
                );


            html += `

                <tr>

                    <td>
                        ${p.articulo}
                    </td>

                    <td>
                        ${p.cantidad}
                    </td>

                    <td>
                        ₡${precioProducto.toLocaleString(
                            "es-CR"
                        )}
                    </td>

                    <td>
                        ₡${envio.toLocaleString(
                            "es-CR"
                        )}
                    </td>

                    <td>
                        ₡${Number(
                            p.total_abonado
                        ).toLocaleString(
                            "es-CR"
                        )}
                    </td>

                    <td>
                        ${paisOrigen}
                    </td>

                    <td>

                        <span
                            class="estado ${estado.clase}"
                        >

                            ${estado.texto}

                        </span>

                    </td>

                </tr>

            `;

        });


        document.getElementById(
            "tabla"
        ).innerHTML =
            html;


    }catch(error){

        console.error(
            "Error cargando archivados:",
            error
        );


        document.getElementById(
            "tabla"
        ).innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="sin-pedidos"
                >

                    No se pudieron cargar los archivos.

                </td>

            </tr>

        `;

    }

}


// ========================================
// VOLVER
// ========================================

document.getElementById(
    "volver"
).addEventListener(
    "click",
    () => {

        window.location.href =
            `/client.html?id=${encodeURIComponent(id)}`;

    }
);


// ========================================
// CERRAR SESIÓN
// ========================================

document.getElementById(
    "cerrarSesion"
).addEventListener(
    "click",
    () => {

        window.location.href =
            "/logout";

    }
);


// ========================================
// AUTO CIERRE TRAS 10 MINUTOS
// ========================================

setTimeout(
    () => {

        window.location.href =
            "/logout";

    },
    600000
);


// ========================================
// INICIAR
// ========================================

cargarNombreCliente();

cargarArchivados();


</script>


</body>

</html>
