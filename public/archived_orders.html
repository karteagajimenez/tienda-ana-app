<!DOCTYPE html>
<html lang="es">

<head>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<meta charset="UTF-8">

<title>Pedidos Archivados</title>

<style>

body {
    font-family: Arial;
    background: linear-gradient(to right, #f8e1e7, #fdf6f0);
    margin: 0;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 25px;
    position: relative;
}

.header h1 {
    font-size: 22px;
    color: #c48b9f;
    margin: 0;
}


/* =========================================================
   LOGO
========================================================= */

.logo-container {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}

.logo {
    height: 90px;
}


/* =========================================================
   BOTONES HEADER
========================================================= */

.header-buttons button {
    background: #b76e8a;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
    margin-left: 8px;
    font-weight: bold;
}

.header-buttons button:last-child {
    background: #e74c3c;
}

.header-buttons button:hover {
    opacity: 0.85;
}


/* =========================================================
   BUSCADOR
========================================================= */

#buscar {
    width: 100%;
    max-width: 500px;
    padding: 12px;
    margin: 20px auto;
    display: block;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
}


/* =========================================================
   TABLA
========================================================= */

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th,
td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

th {
    background: #c48b9f;
    color: white;
}


/* =========================================================
   SALDO
========================================================= */

.saldo-pendiente {
    color: #e74c3c;
    font-weight: bold;
}

.saldo-pagado {
    color: #2ecc71;
    font-weight: bold;
}


/* =========================================================
   SIN ARCHIVADOS
========================================================= */

.sin-archivados {
    padding: 35px;
    color: #777;
    font-size: 16px;
    text-align: center;
}


/* =========================================================
   FECHA ARCHIVADO
========================================================= */

.fecha-archivado {
    color: #a85c78;
    font-weight: bold;
}

/* =========================================================
   BOTÓN DETALLES
========================================================= */

.btn-detalles-archivado {
    background: #c48b9f;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-right: 6px;
}

.btn-detalles-archivado:hover {
    opacity: 0.85;
}

/* =========================================================
   BOTÓN ELIMINAR
========================================================= */

.btn-eliminar-archivado {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn-eliminar-archivado:hover {
    opacity: 0.85;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
    z-index: 3000;
}

.modal-content {
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 90%;
    max-width: 420px;
    text-align: center;
}

.modal-content h3 {
    margin-top: 0;
    color: #c48b9f;
}

.modal-content .ok,
.modal-content .cancel {
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px;
}

.modal-content .ok {
    background: #e74c3c;
    color: white;
}

.modal-content .cancel {
    background: #aaa;
    color: white;
}

</style>

</head>


<body>


<!-- ======================================================
     HEADER
====================================================== -->

<div class="header">

    <h1>📦 Pedidos Archivados</h1>

    <div class="logo-container">

        <img
            src="logo.jpg"
            class="logo"
            alt="Logo"
        >

    </div>

    <div class="header-buttons">

        <button
            onclick="volverArchivados()"
        >
            Volver a Gestión
        </button>

        <button
            onclick="location.href='/logout'"
        >
            Cerrar sesión
        </button>

    </div>

</div>


<!-- ======================================================
     BUSCADOR
====================================================== -->

<input
    type="text"
    id="buscar"
    placeholder="Buscar cliente archivado..."
    onkeyup="filtrar()"
>


<!-- ======================================================
     TABLA
====================================================== -->

<table>

    <thead>

        <tr>

            <th>Cliente</th>

            <th>Peso</th>

            <th>Valor del Peso</th>

            <th>Estado</th>

            <th>Abono</th>

            <th>Saldo</th>

            <th>Fecha</th>

            <th>Archivado</th>

            <th>Eliminar</th>

        </tr>

    </thead>


    <tbody id="tablaArchivados">

    </tbody>

</table>


<!-- ======================================================
     MODAL ELIMINAR ARCHIVADO
====================================================== -->

<div class="modal" id="modalEliminarArchivado">

    <div class="modal-content">

        <h3>Eliminar archivado</h3>

        <p id="mensajeEliminarArchivado"></p>

        <br>

        <button
            class="ok"
            onclick="confirmarEliminarArchivado()"
        >
            Eliminar
        </button>

        <button
            class="cancel"
            onclick="cancelarEliminarArchivado()"
        >
            Cancelar
        </button>

    </div>

</div>


<script>


/* =========================================================
   VARIABLES
========================================================= */

let pedidosArchivados = [];

let archivadosPorCliente = {};

let clienteArchivadoSeleccionado = null;

let clienteArchivadoParaEliminar = null;

let grupoArchivadoParaEliminar = null;

let pedidoArchivadoParaEliminar = null;

/* =========================================================
   TRADUCIR ESTADOS
========================================================= */

function traducirEstado(estado){

    switch(estado){

        case "En_EEUU":
            return "Estados Unidos";

        case "EN_CAMINO":
            return "En camino";

        case "COSTA_RICA":
            return "Costa Rica";

        case "EMPACADO":
            return "Empacado";

        case "ENTREGADO":
            return "Entregado";

        default:
            return estado || "-";

    }

}


/* =========================================================
   FORMATEAR DINERO
========================================================= */

function moneda(valor){

    return "₡" +
        Number(valor || 0)
        .toLocaleString(
            "es-CR",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

}


/* =========================================================
   FORMATEAR FECHA
========================================================= */

function formatearFecha(fecha){

    if(!fecha){
        return "-";
    }

    return String(fecha).split("T")[0];

}


/* =========================================================
   CARGAR PEDIDOS ARCHIVADOS
========================================================= */

async function cargarArchivados(){

    try{

        const respuesta =
            await fetch(
                "/archived-orders"
            );


        if(!respuesta.ok){

            console.error(
                "Error cargando archivados"
            );

            return;

        }


        const data =
            await respuesta.json();


        pedidosArchivados =
            data;


        archivadosPorCliente =
            {};


        /* =================================================
           AGRUPAR POR CLIENTE Y FACTURA
        ================================================= */

        data.forEach(pedido => {

            const idUsuario =
                Number(
                    pedido.id_usuario
                );


            if(
                !archivadosPorCliente[
                    idUsuario
                ]
            ){

                archivadosPorCliente[
                    idUsuario
                ] = {

                    id_usuario:
                        idUsuario,

                    nombre:
                        pedido.nombre,

                    apellido:
                        pedido.apellido,

                    grupos:
                        {}

                };

            }


            const cliente =
                archivadosPorCliente[
                    idUsuario
                ];


            /* =============================================
               IDENTIFICAR FACTURA / GRUPO
            ============================================= */

            let claveGrupo;


            if(
                pedido.grupo_compra !== null &&
                pedido.grupo_compra !== undefined
            ){

                claveGrupo =
                    String(
                        Number(
                            pedido.grupo_compra
                        )
                    );

            }else{

                /*
                    Pedido antiguo sin grupo.
                    Se mantiene separado para no mezclarlo
                    con otros pedidos archivados.
                */

                claveGrupo =
                    `legacy-${pedido.id_pedido}`;

            }


            if(
                !cliente.grupos[
                    claveGrupo
                ]
            ){

                cliente.grupos[
                    claveGrupo
                ] = {

                    grupo_compra:
                        pedido.grupo_compra !== null &&
                        pedido.grupo_compra !== undefined
                            ? Number(
                                pedido.grupo_compra
                            )
                            : null,

                    pais_origen:
                        pedido.pais_origen || null,

                    peso_total:
                        0,

                    envio_total:
                        0,

                    total_abonado:
                        0,

                    fecha_abono:
                        null,

                    fecha_archivado:
                        null,

                    estados:
                        new Set(),

                    pedidos:
                        []

                };

            }


            const grupo =
                cliente.grupos[
                    claveGrupo
                ];


            grupo.pedidos.push(
                pedido
            );


            /* =============================================
               PESO
            ============================================= */

            const peso =
                Number(
                    pedido.peso_gramos
                ) || 0;


            grupo.peso_total +=
                peso;


            /* =============================================
               VALOR ENVÍO
            ============================================= */

            const envio =
                (peso / 1000) *
                6000;


            grupo.envio_total +=
                envio;


            /* =============================================
               ABONO
            ============================================= */

            grupo.total_abonado +=
                Number(
                    pedido.total_abonado
                ) || 0;


            /* =============================================
               ESTADO
            ============================================= */

            if(pedido.estado){

                grupo.estados.add(
                    pedido.estado
                );

            }


            /* =============================================
               PAÍS DE ORIGEN
            ============================================= */

            if(
                !grupo.pais_origen &&
                pedido.pais_origen
            ){

                grupo.pais_origen =
                    pedido.pais_origen;

            }


            /* =============================================
               FECHA DEL ÚLTIMO ABONO
            ============================================= */

            if(pedido.fecha_abono){

                const fecha =
                    String(
                        pedido.fecha_abono
                    ).split("T")[0];


                if(
                    !grupo.fecha_abono ||
                    fecha >
                    grupo.fecha_abono
                ){

                    grupo.fecha_abono =
                        fecha;

                }

            }


            /* =============================================
               FECHA ARCHIVADO MÁS RECIENTE
            ============================================= */

            if(
                pedido.fecha_archivado
            ){

                const fechaArchivado =
                    String(
                        pedido.fecha_archivado
                    ).split("T")[0];


                if(
                    !grupo.fecha_archivado ||
                    fechaArchivado >
                    grupo.fecha_archivado
                ){

                    grupo.fecha_archivado =
                        fechaArchivado;

                }

            }

        });


        mostrarArchivados();


    }catch(error){

        console.error(
            "Error cargando pedidos archivados:",
            error
        );

    }

}

/* =========================================================
   MOSTRAR ARCHIVADOS
========================================================= */

function mostrarArchivados(){

    if(
        clienteArchivadoSeleccionado
    ){

        mostrarFacturasArchivadasCliente(
            clienteArchivadoSeleccionado
        );

        return;

    }


    mostrarListaClientesArchivados();

}


/* =========================================================
   MOSTRAR LISTA DE CLIENTES ARCHIVADOS
========================================================= */

function mostrarListaClientesArchivados(){

    const tabla =
        document.getElementById(
            "tablaArchivados"
        );


    const encabezado =
        document.querySelector(
            "table thead"
        );


    encabezado.innerHTML = `

        <tr>

            <th>Cliente</th>

        </tr>

    `;


    const clientes =
        Object.values(
            archivadosPorCliente
        );


    if(
        clientes.length === 0
    ){

        tabla.innerHTML = `

            <tr>

                <td
                    class="sin-archivados"
                >
                    No hay pedidos archivados.
                </td>

            </tr>

        `;

        return;

    }


    clientes.sort(
        (a, b) => {

            const nombreA =
                `${a.nombre} ${a.apellido}`
                .toLowerCase();


            const nombreB =
                `${b.nombre} ${b.apellido}`
                .toLowerCase();


            return nombreA.localeCompare(
                nombreB
            );

        }
    );


    let html = "";


    clientes.forEach(
        cliente => {

            html += `

                <tr>

                    <td
                        onclick="abrirClienteArchivado(${cliente.id_usuario})"
                        style="
                            cursor:pointer;
                            font-weight:bold;
                            color:#a85c78;
                        "
                    >

                        ${cliente.nombre}
                        ${cliente.apellido}

                    </td>

                </tr>

            `;

        }
    );


    tabla.innerHTML =
        html;

}


/* =========================================================
   ABRIR CLIENTE ARCHIVADO
========================================================= */

function abrirClienteArchivado(
    idUsuario
){

    const idCliente =
        Number(
            idUsuario
        );


    if(
        !archivadosPorCliente[
            idCliente
        ]
    ){

        return;

    }


    clienteArchivadoSeleccionado =
        idCliente;


    document.getElementById(
        "buscar"
    ).value =
        "";


    mostrarFacturasArchivadasCliente(
        idCliente
    );

}


/* =========================================================
   VOLVER A LISTA DE CLIENTES ARCHIVADOS
========================================================= */

function volverClientesArchivados(){

    clienteArchivadoSeleccionado =
        null;


    document.getElementById(
        "buscar"
    ).value =
        "";


    mostrarListaClientesArchivados();

}


/* =========================================================
   VOLVER DESDE ARCHIVADOS
========================================================= */

function volverArchivados(){

    /*
        Si estamos viendo las facturas archivadas
        de un cliente, vuelve primero a la lista
        de clientes archivados.
    */

    if(
        clienteArchivadoSeleccionado
    ){

        volverClientesArchivados();

        return;

    }


    /*
        Si ya estamos en la lista de clientes
        archivados, vuelve a Gestión de Pedidos.
    */

    window.location.href =
        "/add_weight.html";

}

/* =========================================================
   MOSTRAR FACTURAS ARCHIVADAS DEL CLIENTE
========================================================= */

function mostrarFacturasArchivadasCliente(
    idUsuario
){

    const cliente =
        archivadosPorCliente[
            Number(
                idUsuario
            )
        ];


    if(!cliente){

        volverClientesArchivados();

        return;

    }


    const tabla =
        document.getElementById(
            "tablaArchivados"
        );


    const encabezado =
        document.querySelector(
            "table thead"
        );


    encabezado.innerHTML = `

        <tr>

            <th>Cliente</th>

            <th>País de origen</th>

            <th>Peso</th>

            <th>Valor del Peso</th>

            <th>Estado</th>

            <th>Abono</th>

           <th>Saldo</th>

           <th>Fecha</th>

           <th>Archivado</th>

           <th>Acciones</th>

        </tr>

    `;


    const grupos =
        Object.entries(
            cliente.grupos
        );


    if(
        grupos.length === 0
    ){

        tabla.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="sin-archivados"
                >
                    No hay facturas archivadas
                    para este cliente.
                </td>

            </tr>

        `;

        return;

    }

    let html = "";


    grupos.forEach(
        ([claveGrupo, grupo]) => {


            /* =============================================
               ESTADO
            ============================================= */

            const estados =
                Array.from(
                    grupo.estados
                );


            let estadoMostrar =
                "-";


            if(
                estados.length === 1
            ){

                estadoMostrar =
                    traducirEstado(
                        estados[0]
                    );

            }


            if(
                estados.length > 1
            ){

                estadoMostrar =
                    "Varios";

            }


            /* =============================================
               SALDO
            ============================================= */

            let saldo =
                grupo.envio_total -
                grupo.total_abonado;


            if(
                saldo < 0
            ){

                saldo = 0;

            }


            const claseSaldo =
                saldo > 0
                    ? "saldo-pendiente"
                    : "saldo-pagado";


            /* =============================================
               PAÍS
            ============================================= */

            let paisMostrar =
                "-";


            if(
                grupo.pais_origen ===
                "EEUU"
            ){

                paisMostrar =
                    "Estados Unidos";

            }


            if(
                grupo.pais_origen ===
                "COLOMBIA"
            ){

                paisMostrar =
                    "Colombia";

            }


            /* =============================================
               FACTURA
            ============================================= */

            const facturaMostrar =
                grupo.grupo_compra
                    ? `Factura ${grupo.grupo_compra}`
                    : "Pedido antiguo";

/* =============================================
   ACCIONES
============================================= */

let acciones = "";


/*
    =====================================================
    FACTURA NORMAL
    =====================================================
*/

if(
    grupo.grupo_compra
){

    acciones = `

        <button
            class="btn-detalles-archivado"
            onclick="verDetallesArchivados(
                ${cliente.id_usuario},
                ${grupo.grupo_compra}
            )"
        >
            Detalles
        </button>

        <button
            class="btn-eliminar-archivado"
            onclick="abrirEliminarArchivado(
                ${cliente.id_usuario},
                ${grupo.grupo_compra},
                null
            )"
        >
            Eliminar
        </button>

    `;

}


/*
    =====================================================
    PEDIDO ANTIGUO SIN FACTURA
    =====================================================
*/

else{

    const pedidoAntiguo =
        grupo.pedidos &&
        grupo.pedidos.length > 0
            ? grupo.pedidos[0]
            : null;


    if(pedidoAntiguo){

        acciones = `

            <button
                class="btn-eliminar-archivado"
                onclick="abrirEliminarArchivado(
                    ${cliente.id_usuario},
                    null,
                    ${pedidoAntiguo.id_pedido}
                )"
            >
                Eliminar
            </button>

        `;

    }else{

        acciones = `
            <span>-</span>
        `;

    }

}

            html += `

                <tr> 
                    <td>
                      ${cliente.nombre} ${cliente.apellido}
                    </td>

                    <td>
                        ${paisMostrar}
                    </td>

                    <td>
                        ${grupo.peso_total} g
                    </td>

                    <td>

                        ${moneda(
                            grupo.envio_total
                        )}

                    </td>

                    <td>
                        ${estadoMostrar}
                    </td>

                    <td>

                        ${moneda(
                            grupo.total_abonado
                        )}

                    </td>

                    <td
                        class="${claseSaldo}"
                    >

                        ${moneda(
                            saldo
                        )}

                    </td>

                    <td>

                        ${
                            grupo.fecha_abono
                                ? grupo.fecha_abono
                                : "-"
                        }

                    </td>

                    <td
                        class="fecha-archivado"
                    >

                        ${
                            grupo.fecha_archivado
                                ? grupo.fecha_archivado
                                : "-"
                        }

                    </td>

                    <td>

                        ${acciones}

                    </td>

                </tr>

            `;

        }
    );


    tabla.innerHTML =
        html;

}

/* =========================================================
   BUSCADOR
========================================================= */

function filtrar(){

    const valor =
        document.getElementById(
            "buscar"
        )
        .value
        .toLowerCase();


    document.querySelectorAll(
        "#tablaArchivados tr"
    ).forEach(fila => {

        const texto =
            fila.innerText
            .toLowerCase();

        fila.style.display =
            texto.includes(valor)
                ? ""
                : "none";

    });

}


/* =========================================================
   DETALLES ARCHIVADOS
========================================================= */

function verDetallesArchivados(
    idUsuario,
    grupoCompra
){

    const idCliente =
        Number(
            idUsuario
        );

    const idGrupo =
        Number(
            grupoCompra
        );


    if(
        !Number.isInteger(idCliente) ||
        idCliente <= 0
    ){

        return;

    }


    if(
        !Number.isInteger(idGrupo) ||
        idGrupo <= 0
    ){

        return;

    }


    window.location.href =
        `/details.html?id=${encodeURIComponent(idCliente)}&grupo=${encodeURIComponent(idGrupo)}&archivado=1`;

}

/* =========================================================
   ABRIR MODAL ELIMINAR
========================================================= */

function abrirEliminarArchivado(
    idUsuario,
    grupoCompra,
    idPedido = null
){

    const cliente =
        archivadosPorCliente[
            Number(idUsuario)
        ];


    if(!cliente){
        return;
    }


    clienteArchivadoParaEliminar =
        Number(idUsuario);


    grupoArchivadoParaEliminar =
        grupoCompra !== null &&
        grupoCompra !== undefined
            ? Number(grupoCompra)
            : null;


    pedidoArchivadoParaEliminar =
        idPedido !== null &&
        idPedido !== undefined
            ? Number(idPedido)
            : null;


    let mensaje = "";


    /*
        =====================================================
        FACTURA NORMAL
        =====================================================
    */

    if(
        grupoArchivadoParaEliminar
    ){

        mensaje =
            `¿Desea eliminar definitivamente esta factura archivada de ${cliente.nombre} ${cliente.apellido}? Se eliminarán todos los pedidos y abonos ligados a esta factura.`;

    }


    /*
        =====================================================
        PEDIDO ANTIGUO SIN FACTURA
        =====================================================
    */

    else if(
        pedidoArchivadoParaEliminar
    ){

        mensaje =
            `¿Desea eliminar definitivamente este pedido antiguo archivado de ${cliente.nombre} ${cliente.apellido}?`;

    }


    else{

        return;

    }


    document.getElementById(
        "mensajeEliminarArchivado"
    ).textContent =
        mensaje;


    document.getElementById(
        "modalEliminarArchivado"
    ).style.display =
        "flex";

}


/* =========================================================
   CANCELAR ELIMINACIÓN
========================================================= */

function cancelarEliminarArchivado(){

    clienteArchivadoParaEliminar =
        null;


    grupoArchivadoParaEliminar =
        null;


    pedidoArchivadoParaEliminar =
        null;


    document.getElementById(
        "modalEliminarArchivado"
    ).style.display =
        "none";

}

/* =========================================================
   CONFIRMAR ELIMINACIÓN
========================================================= */

async function confirmarEliminarArchivado(){

    if(
        !clienteArchivadoParaEliminar
    ){
        return;
    }


    const idUsuario =
        clienteArchivadoParaEliminar;


    try{

        const datosEliminar = {
            id_usuario:
                idUsuario
        };


        /*
            Si estamos eliminando una factura normal,
            mandamos grupo_compra.
        */

        if(
            grupoArchivadoParaEliminar !== null &&
            grupoArchivadoParaEliminar !== undefined
        ){

            datosEliminar.grupo_compra =
                grupoArchivadoParaEliminar;

        }


        /*
            Si después usamos esta misma lógica para
            un pedido antiguo sin factura, también
            podremos mandar id_pedido.
        */

        if(
            typeof pedidoArchivadoParaEliminar !== "undefined" &&
            pedidoArchivadoParaEliminar !== null
        ){

            datosEliminar.id_pedido =
                pedidoArchivadoParaEliminar;

        }


        const respuesta =
            await fetch(
                "/delete-archived-client-orders",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(
                        datosEliminar
                    )
                }
            );


        const resultado =
            await respuesta.json();


        if(
            !respuesta.ok ||
            !resultado.ok
        ){

            console.error(
                resultado.mensaje ||
                "No se pudo eliminar el archivado"
            );

            return;

        }


        cancelarEliminarArchivado();


        await cargarArchivados();


    }catch(error){

        console.error(
            "Error eliminando archivado:",
            error
        );

    }

}


/* =========================================================
   INICIAR
========================================================= */

async function iniciarArchivados(){

    await cargarArchivados();


    const parametrosURL =
        new URLSearchParams(
            window.location.search
        );


    const idClienteURL =
        Number(
            parametrosURL.get("id")
        );


    if(
        Number.isInteger(idClienteURL) &&
        idClienteURL > 0 &&
        archivadosPorCliente[idClienteURL]
    ){

        clienteArchivadoSeleccionado =
            idClienteURL;


        mostrarFacturasArchivadasCliente(
            idClienteURL
        );


        window.history.replaceState(
            {},
            "",
            "/archived_orders.html"
        );

    }

}


iniciarArchivados();
</script>
