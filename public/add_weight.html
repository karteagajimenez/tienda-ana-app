let tipo = "";

/* =========================================================
   ESTADOS
========================================================= */

function traducirEstado(estado){

    switch(estado){

        case "En_EEUU":
        case "COLOMBIA":
            return "En origen";

        case "EN_CAMINO":
            return "En camino";

        case "COSTA_RICA":
            return "Costa Rica";

        case "EMPACADO":
            return "Empacado";

        case "ENTREGADO":
            return "Entregado";

        default:
            return estado || "-";

    }

}



/* =========================================================
   PAÍS DE ORIGEN
========================================================= */

function traducirPaisOrigen(pais){

    switch(pais){

        case "EEUU":
            return "Estados Unidos";

        case "COLOMBIA":
            return "Colombia";

        default:
            return pais || "-";

    }

}



/* =========================================================
   FORMATEAR DINERO
========================================================= */

function moneda(valor){

    return "₡" +
        Number(valor || 0)
        .toLocaleString(
            "es-CR",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        );

}



/* =========================================================
   OBTENER CLAVE DEL GRUPO
========================================================= */

function obtenerClaveGrupo(pedido){

    /*
        PEDIDOS NUEVOS

        Utilizan grupo_compra real.
    */

    if(
        pedido.grupo_compra !== null &&
        pedido.grupo_compra !== undefined &&
        Number(pedido.grupo_compra) > 0
    ){

        return String(
            pedido.grupo_compra
        );

    }


    /*
        PEDIDOS ANTIGUOS

        Si todavía no tienen grupo_compra,
        los dejamos separados para evitar
        mezclar facturas antiguas por accidente.
    */

    return `legacy-${pedido.id_pedido}`;

}



/* =========================================================
   CARGAR PEDIDOS
========================================================= */
function obtenerClientesAbiertos(){

    const abiertos = [];

    document.querySelectorAll(
        '[id^="detalle-cliente-"]'
    ).forEach(
        fila => {

            if(
                fila.style.display ===
                "table-row"
            ){

                const idUsuario =
                    Number(
                        fila.id.replace(
                            "detalle-cliente-",
                            ""
                        )
                    );

                abiertos.push(
                    idUsuario
                );

            }

        }
    );

    return abiertos;
}

async function cargarPedidos(){

    
    try{

        const clientesAbiertos =
          obtenerClientesAbiertos();
          
        const res =
            await fetch("/orders");


        const data =
            await res.json();


        pedidosGlobales =
            data;


        pedidosPorCliente =
            {};



        /* =================================================
           AGRUPAR PRIMERO POR CLIENTE
           Y DESPUÉS POR FACTURA / GRUPO
        ================================================= */

        data.forEach(p => {


            const idUsuario =
                Number(
                    p.id_usuario
                );


            if(!pedidosPorCliente[idUsuario]){


                pedidosPorCliente[idUsuario] = {

                    id_usuario:
                        idUsuario,

                    nombre:
                        p.nombre,

                    apellido:
                        p.apellido,

                    grupos:
                        {}

                };

            }



            const cliente =
                pedidosPorCliente[
                    idUsuario
                ];



            const claveGrupo =
                obtenerClaveGrupo(p);



            if(!cliente.grupos[claveGrupo]){


                cliente.grupos[
                    claveGrupo
                ] = {

                    clave:
                        claveGrupo,

                    grupo_compra:
                        Number(
                            p.grupo_compra
                        ) > 0
                            ? Number(
                                p.grupo_compra
                            )
                            : null,

                    pais_origen:
                        p.pais_origen ||
                        (
                            p.estado ===
                            "COLOMBIA"
                                ? "COLOMBIA"
                                : "EEUU"
                        ),

                    peso_total:
                        0,

                    envio_total:
                        0,

                    total_abonado:
                        0,

                    fecha_abono:
                        null,

                    estados:
                        new Set(),

                    pedidos:
                        []

                };

            }



            const grupo =
                cliente.grupos[
                    claveGrupo
                ];



            /* =================================================
               GUARDAR PEDIDO
            ================================================= */

            grupo.pedidos.push(
                p
            );



            /* =================================================
               PESO
            ================================================= */

            const peso =
                Number(
                    p.peso_gramos
                ) || 0;


            grupo.peso_total +=
                peso;



            /* =================================================
               ENVÍO
            ================================================= */

            const envio =
                (peso / 1000) *
                6000;


            grupo.envio_total +=
                envio;



            /* =================================================
               ABONOS
            ================================================= */

            grupo.total_abonado +=
                Number(
                    p.total_abonado
                ) || 0;



            /* =================================================
               ESTADO
            ================================================= */

            if(p.estado){

                grupo.estados.add(
                    p.estado
                );

            }



            /* =================================================
               FECHA MÁS RECIENTE
            ================================================= */

            if(p.fecha_abono){


                const fecha =
                    p.fecha_abono
                    .split("T")[0];


                if(
                    !grupo.fecha_abono ||
                    fecha >
                    grupo.fecha_abono
                ){

                    grupo.fecha_abono =
                        fecha;

                }

            }


        });



        /* =================================================
           SI ESTAMOS VIENDO UN CLIENTE
           Y YA NO TIENE PEDIDOS ACTIVOS,

/* =========================================================
   RENDERIZAR VISTA ACTUAL
========================================================= */
function renderizarVista(){

    mostrarListaClientes();


    if(clienteVistaActual){

        const cliente =
            pedidosPorCliente[
                Number(
                    clienteVistaActual
                )
            ];

        if(!cliente){
            return;
        }


        const clientes =
            obtenerClientesFiltrados();

        const indice =
            clientes.findIndex(
                c =>
                    Number(c.id_usuario) ===
                    Number(clienteVistaActual)
            );


        if(indice !== -1){

            paginaActual =
                Math.floor(
                    indice /
                    clientesPorPagina
                ) + 1;

            mostrarListaClientes();


            setTimeout(
                () => {

                    toggleCliente(
                        Number(
                            clienteVistaActual
                        )
                    );

                },
                0
            );
        }
    }
}

function obtenerClientesFiltrados(){

    const buscar =
        document.getElementById(
            "buscar"
        );

    const valor =
        buscar
            ? buscar.value
                .toLowerCase()
                .trim()
            : "";


    return Object.values(
        pedidosPorCliente
    )
    .filter(
        cliente => {

            const nombreCompleto =
                `${cliente.nombre} ${cliente.apellido}`
                .toLowerCase();

            return nombreCompleto.includes(
                valor
            );
        }
    )
    .sort(
        (a, b) =>
            `${a.nombre} ${a.apellido}`
            .localeCompare(
                `${b.nombre} ${b.apellido}`,
                "es"
            )
    );
}

/* =========================================================
   PAGINACIÓN - CLIENTES
========================================================= */

function actualizarPaginacion(){

const clientes =
    obtenerClientesFiltrados();

    const totalClientes =
        clientes.length;

    const inicio =
        (paginaActual - 1) *
        clientesPorPagina;

    const fin =
        Math.min(
            inicio + clientesPorPagina,
            totalClientes
        );

    const texto =
        document.getElementById(
            "textoPaginacion"
        );

    const anterior =
        document.getElementById(
            "btnAnterior"
        );

    const siguiente =
        document.getElementById(
            "btnSiguiente"
        );


   if(totalClientes === 0){

    texto.textContent =
        "0 de 0";

    anterior.style.visibility =
        "hidden";

    siguiente.style.visibility =
        "hidden";

    return;
     }


    texto.textContent =
        `${inicio + 1} - ${fin} de ${totalClientes}`;

anterior.style.visibility =
    paginaActual === 1
        ? "hidden"
        : "visible";


siguiente.style.visibility =
    fin >= totalClientes
        ? "hidden"
        : "visible";
}


function paginaAnterior(){

    if(paginaActual <= 1){
        return;
    }

    paginaActual--;

    mostrarListaClientes();
}

function paginaSiguiente(){

    const clientes =
        obtenerClientesFiltrados();

    const totalClientes =
        clientes.length;

    const totalPaginas =
        Math.ceil(
            totalClientes /
            clientesPorPagina
        );

    if(paginaActual >= totalPaginas){
        return;
    }

    paginaActual++;

    mostrarListaClientes();
}

async function cargarAbonosParaEditar(){

    const selectArticulo =
        document.getElementById(
            "editarAbonoArticulo"
        );

    const selectAbono =
        document.getElementById(
            "editarAbonoRegistro"
        );

    const inputMonto =
        document.getElementById(
            "editarAbonoMonto"
        );

    const idPedido =
        Number(
            selectArticulo.value
        );

    selectAbono.innerHTML = `
        <option value="">
            Seleccione el abono
        </option>
    `;

    selectAbono.style.display =
        "none";

    inputMonto.value =
        "";

    inputMonto.style.display =
        "none";

    if(!idPedido){
        return;
    }

    try{

        const respuesta =
            await fetch(
                `/payments/${idPedido}`
            );

        const data =
            await respuesta.json();

        if(
            !respuesta.ok ||
            !data.ok
        ){

            mostrarMensaje(
                data.mensaje ||
                "No se pudieron cargar los abonos"
            );

            return;

        }

        if(
            !data.abonos ||
            data.abonos.length === 0
        ){

            mostrarMensaje(
                "Este artículo no tiene abonos registrados"
            );

            return;

        }

        data.abonos.forEach(
            abono => {

                const opcion =
                    document.createElement(
                        "option"
                    );

                opcion.value =
                    abono.id_abono;

                opcion.dataset.monto =
                    abono.monto_abono;

                const fechaLimpia =
                    String(
                        abono.fecha_abono
                    ).split("T")[0];

                opcion.textContent =
                    `${moneda(abono.monto_abono)} - ${fechaLimpia}`;

                selectAbono.appendChild(
                    opcion
                );

            }
        );

        selectAbono.style.display =
            "block";

    }catch(error){

        console.error(
            "Error cargando abonos:",
            error
        );

        mostrarMensaje(
            "No se pudieron cargar los abonos"
        );

    }

}

function normalizarArticuloEditar(texto){

    return String(
        texto || ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .trim();

}

function mostrarArticulosEditar(filtro = ""){

    const listaArticulos =
        document.getElementById(
            "editarListaArticulos"
        );

    const buscar =
        normalizarArticuloEditar(
            filtro
        );


    const resultados =
        articulosEditar.filter(
            articulo =>

                normalizarArticuloEditar(
                    articulo.nombre
                ).includes(buscar)
        );


    listaArticulos.innerHTML = "";


    if(resultados.length === 0){

        listaArticulos.innerHTML = `
            <div class="sin-resultados">
                No se encontraron artículos guardados.
            </div>
        `;

        listaArticulos.classList.add(
            "mostrar"
        );

        return;

    }


    resultados.forEach(articulo => {

        const opcion =
            document.createElement("div");


        opcion.className =
            "opcion-buscador";


        const nombre =
            document.createElement("div");


        nombre.className =
            "nombre-articulo-lista";


        nombre.textContent =
            articulo.nombre || "";


        opcion.appendChild(nombre);


        if(articulo.descripcion){

            const descripcion =
                document.createElement("div");


            descripcion.className =
                "descripcion-articulo-lista";


            descripcion.textContent =
                articulo.descripcion;


            opcion.appendChild(
                descripcion
            );

        }


        opcion.addEventListener(
            "mousedown",
            (e) => {

                e.preventDefault();

                seleccionarArticuloEditar(
                    articulo

        );


        listaArticulos.appendChild(

function cargarPedidoEditar(){

    const pedidoSelect =
        document.getElementById(
            "editarPedidoSelect"
        );


    const buscadorContenedor =
        document.getElementById(
            "editarBuscadorContenedor"
        );


    const buscarArticulo =
        document.getElementById(
            "editarBuscarArticulo"
        );


    const articuloSelect =
        document.getElementById(
            "editarArticuloSelect"
        );


    const cantidadInput =
        document.getElementById(
            "editarCantidad"
        );

    const pesoInput =
        document.getElementById(
         "editarPeso"
        );
const labelCantidad =
    document.getElementById(
        "labelEditarCantidad"
    );

const labelPeso =
    document.getElementById(
        "labelEditarPeso"
    );

    const idPedido =
        Number(
            pedidoSelect.value
        );


    const cliente =
        pedidosPorCliente[
            clienteSeleccionado
        ];


    if(!cliente){

        return;

    }


    const grupo =
        cliente.grupos[
            String(grupoSeleccionado)
        ];


    if(!grupo){

        return;

    }


    const pedido =
        grupo.pedidos.find(
            p =>
                Number(
                    p.id_pedido
                ) ===
                idPedido
        );


    if(!pedido){

        buscadorContenedor.style.display =
            "none";


        cantidadInput.style.display =
            "none";
        
        pesoInput.style.display =
            "none";


        buscarArticulo.value =
            "";


        articuloSelect.value =
            "";


        cantidadInput.value =
            "";
        pesoInput.value =
            "";


        document.getElementById(
            "editarListaArticulos"
        ).classList.remove(
            "mostrar"
        );


        return;

    }


    /*
        Mostrar buscador y cantidad
        después de elegir cuál pedido
        se desea editar.
    */

    buscadorContenedor.style.display =
        "block";


    cantidadInput.style.display =
        "block";

    labelCantidad.style.display =
       "block";

    labelPeso.style.display =
      "block";

    pesoInput.style.display =
        "block";


    /*
        IMPORTANTE:

        El artículo nuevo queda vacío.

        No colocamos automáticamente
        el artículo actual porque aquí
        Ana debe escoger cuál será el
        artículo correcto del catálogo.
    */

    buscarArticulo.value =
        "";


    articuloSelect.value =
        "";


    /*
        La cantidad sí conserva
        la cantidad actual.

        Si era 1 puede quedarse en 1.
        Si necesita 2, 3, etc.,
        se modifica manualmente.
    */

    cantidadInput.value =
        pedido.cantidad;
    
    pesoInput.value =
     Number(
        pedido.peso_gramos
       ) || "";


    /*
        Mostrar todos los artículos
        disponibles en el catálogo.
    */

    mostrarArticulosEditar(
        ""
    );


    document.getElementById(
        "editarListaArticulos"
    ).classList.add(
        "mostrar"
    );


    /*
        Colocar el cursor directamente
        en el buscador del nuevo artículo.
    */

    buscarArticulo.focus();

}

let clienteParaArchivar = null;
let grupoParaArchivar = null;


function archivarCliente(
    idUsuario,
    grupoCompra
){

    const cliente =
        pedidosPorCliente[
            Number(idUsuario)
        ];


    if(!cliente){

        mostrarMensaje(
            "No se encontró el cliente"
        );

        return;

    }


    const grupo =
        cliente.grupos[
            String(
                Number(grupoCompra)
            )
        ];


    if(!grupo){

        mostrarMensaje(
            "No se encontró la factura seleccionada"
        );

        return;

    }


    clienteParaArchivar =
        Number(idUsuario);


    grupoParaArchivar =
        Number(grupoCompra);


    document.getElementById(
        "mensajeArchivar"
    ).textContent =
        `¿Desea archivar esta factura de ${cliente.nombre} ${cliente.apellido}?`;


    document.getElementById(
        "modalArchivar"
    ).style.display =
        "flex";

}



function cancelarArchivar(){

    clienteParaArchivar =
        null;


    grupoParaArchivar =
        null;


    document.getElementById(
        "modalArchivar"
    ).style.display =
        "none";

}



async function confirmarArchivar(){

    if(
        !clienteParaArchivar ||
        !grupoParaArchivar
    ){

        return;

    }


    const idUsuario =
        clienteParaArchivar;


    const grupoCompra =
        grupoParaArchivar;


    try{

        const respuesta =
            await fetch(
                "/archive-client-orders",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        id_usuario:
                            idUsuario,

                        grupo_compra:
                            grupoCompra

                    })
                }
            );


        const resultado =
            await respuesta.json();


        if(
            !respuesta.ok ||
            !resultado.ok
        ){

            mostrarMensaje(
                resultado.mensaje ||
                "No se pudo archivar la factura"
            );

            return;

        }


        cancelarArchivar();


        await cargarPedidos();


    }catch(error){

        console.error(
            "Error archivando factura:",
            error
        );


        mostrarMensaje(
            "Error al archivar la factura"
        );

    }

}
