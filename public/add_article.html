<!DOCTYPE html>
<html lang="es">

<head>

<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta charset="UTF-8">

<title>Agregar artículo - Tienda Ana</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,#f8e1e7,#fdf6f0);
    margin:0;
    padding:0;
    transition:padding-left 0.3s ease;
}


/* ======================================================
   MENÚ LATERAL
====================================================== */

.menu-lateral{
    position:fixed;
    top:0;
    left:0;
    width:0;
    height:100vh;
    background:#efd0da;
    overflow:hidden;
    transition:width 0.3s ease;
    z-index:5000;
    box-shadow:2px 0 8px rgba(0,0,0,0.08);
}

.menu-lateral.abierto{
    width:255px;
}

.menu-lateral-superior{
    height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.btn-menu-lateral{
    position:fixed;
    top:28px;
    left:18px;
    z-index:6000;

    width:42px;
    height:42px;

    padding:0;
    border:none;
    background:transparent;

    color:#b76e8a;
    font-size:30px;
    font-weight:normal;

    cursor:pointer;
}

.menu-lateral.abierto .btn-menu-lateral{
    position:absolute;
}

.logo-menu-lateral{
    width:82px;
    height:auto;
    border-radius:10px;
}
.menu-lateral-contenido{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:15px 12px;
}

.menu-lateral-contenido button{
    width:100%;

    border:none;
    border-radius:7px;

    background:#c48b9f;
    color:white;

    font-family:Arial, sans-serif;
    font-size:14px;
    font-weight:normal;

    text-align:center;

    padding:10px 12px;

    cursor:pointer;
}
.menu-lateral-contenido button:hover{
    opacity:0.88;
    transform:translateX(2px);
}


/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 25px 15px 75px;
    position:relative;
    transition:margin-left 0.3s ease;
}

.header h1{
    font-size:22px;
    color:#c48b9f;
    margin:0;
}

.logo-container{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

.logo-header{
    height:90px;
}


/* CONTENEDOR */

.contenedor{
    width:90%;
    max-width:650px;
    margin:40px auto;
    transition:transform 0.3s ease;
}

.tarjeta{
    background:white;
    padding:35px;
    border-radius:10px;
    box-shadow:0 3px 15px rgba(0,0,0,0.12);
}

.tarjeta h2{
    color:#c48b9f;
    margin-top:0;
    margin-bottom:25px;
    text-align:center;
}


/* CAMPOS */

.campo{
    margin-bottom:20px;
}

.campo label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#555;
}

.campo input,
.campo textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    font-size:15px;
    font-family:Arial, sans-serif;
}

.campo textarea{
    min-height:120px;
    resize:vertical;
}

.campo input:focus,
.campo textarea:focus{
    outline:none;
    border-color:#c48b9f;
}


/* BOTONES */

.botones{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}

button{
    border:none;
    padding:11px 18px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.agregar{
    background:#2ecc71;
    color:white;
}

button:hover{
    opacity:0.85;
}


/* TOAST */

.toast{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#2ecc71;
    color:white;
    padding:12px 22px;
    border-radius:7px;
    font-weight:bold;
    display:none;
    z-index:9999;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.toast.error{
    background:#e74c3c;
}


/* RESPONSIVE */
@media(max-width:700px){

    .menu-lateral.abierto{
        width:255px;
    }

    .menu-lateral.abierto .menu-lateral-superior{
        position:relative;
        width:100%;
        height:110px;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .menu-lateral.abierto .logo-menu-lateral{
        width:82px;
    }

    .menu-lateral.abierto .btn-menu-lateral{
        position:absolute;
        top:28px;
        left:18px;
    }

    .header{
        padding-left:65px;
    }

    .header h1{
        font-size:18px;
    }

    .logo-container{
        position:static;
        transform:none;
    }

    .logo-header{
        height:70px;
    }

    .tarjeta{
        padding:25px;
    }

}
</style>

</head>


<body>


<div
    id="toast"
    class="toast"
></div>


<!-- ======================================================
     MENÚ LATERAL
====================================================== -->

<div
    id="menuLateral"
    class="menu-lateral"
>

    <div class="menu-lateral-superior">

        <button
            type="button"
            id="btnMenuLateral"
            class="btn-menu-lateral"
            onclick="toggleMenuLateral()"
            title="Abrir o cerrar menú"
        >
            ☰
        </button>

        <img
            src="logo.jpg"
            alt="Logo Tienda Ana"
            class="logo-menu-lateral"
        >

    </div>


    <div class="menu-lateral-contenido">

        <button
            type="button"
            onclick="window.location.href='/dashboard.html'"
        >
            📝 Crear pedido
        </button>

        <button
            type="button"
            onclick="irAgregarCliente()"
        >
            👤＋ Agregar cliente
        </button>

        <button
            type="button"
            onclick="irEditarCliente()"
        >
            👤✎ Editar cliente
        </button>

        <button
            type="button"
            onclick="window.location.href='/add_article.html'"
        >
            🛍️+ Agregar artículos
        </button>

        <button
            type="button"
            onclick="window.location.href='/articles.html'"
        >
           🛍️✎ Editar artículos
        </button>

        <button
            type="button"
            onclick="window.location.href='/add_weight.html'"
        >
            📄 Facturas
        </button>

    </div>

</div>


<div class="header">

    <h1>
        📦 Agregar artículo
    </h1>

    <div class="logo-container">

        <img
            src="logo.jpg"
            class="logo-header"
            alt="Tienda Ana"
        >

    </div>

</div>



<div class="contenedor">

    <div class="tarjeta">

        <h2>
            Nuevo artículo
        </h2>


        <form id="formArticulo">


            <div class="campo">

                <label for="nombre">
                    Nombre del artículo
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ejemplo: Plancha Baby Liss PRO"
                    required
                >

            </div>


            <div class="campo">

                <label for="tasa">
                    Tasa
                </label>

                <input
                    type="number"
                    id="tasa"
                    placeholder="Precio del artículo"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <div class="campo">

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    placeholder="Ejemplo: 1 pulgada / 25 mm"
                ></textarea>

            </div>


            <div class="botones">

                <button
                    type="submit"
                    class="agregar"
                >
                    Agregar
                </button>

            </div>


        </form>

    </div>

</div>



<script>


/* ======================================================
   MENÚ LATERAL
====================================================== */

function toggleMenuLateral(){

    const menu =
        document.getElementById(
            "menuLateral"
        );

    menu.classList.toggle(
        "abierto"
    );

}


function irAgregarCliente(){

    window.location.href =
        "/dashboard.html?abrir=agregar-cliente";

}


function irEditarCliente(){

    window.location.href =
        "/dashboard.html?abrir=editar-cliente";

}


/* ======================================================
   TOAST
====================================================== */

function mostrarToast(
    mensaje,
    error = false
){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.innerText =
        mensaje;

    toast.className =
        error
            ? "toast error"
            : "toast";

    toast.style.display =
        "block";


    setTimeout(
        () => {

            toast.style.display =
                "none";

        },
        3000
    );

}



/* ======================================================
   GUARDAR ARTÍCULO
====================================================== */

document.getElementById(
    "formArticulo"
).addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const nombre =
            document.getElementById(
                "nombre"
            ).value.trim();


        const tasa =
            document.getElementById(
                "tasa"
            ).value;


        const descripcion =
            document.getElementById(
                "descripcion"
            ).value.trim();



        if(!nombre){

            mostrarToast(
                "Ingrese el nombre del artículo.",
                true
            );

            return;

        }



        try{

            const respuesta =
                await fetch(
                    "/create-article",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            nombre,
                            tasa,
                            descripcion
                        })

                    }
                );


            const datos =
                await respuesta.json();



            if(!respuesta.ok){

                mostrarToast(
                    datos.mensaje ||
                    "No se pudo guardar el artículo.",
                    true
                );

                return;

            }



            mostrarToast(
                "Artículo agregado correctamente."
            );


            document.getElementById(
                "formArticulo"
            ).reset();


        }catch(error){

            console.error(
                "Error guardando artículo:",
                error
            );

            mostrarToast(
                "Ocurrió un error guardando el artículo.",
                true
            );

        }

    }
);


</script>


</body>

</html>
