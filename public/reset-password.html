<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <title>Restablecer Contraseña</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #2c3e50;
        }

        input {
            display: block;
            margin: 12px auto;
            padding: 12px;
            width: 90%;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 6px rgba(79,172,254,0.5);
            outline: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4facfe;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 120px;
            transition: 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        #mensaje {
            margin-top: 15px;
            color: green;
        }

        #error {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 Restablecer Contraseña</h2>

    <form id="resetForm">
        <input type="password" name="password" placeholder="Nueva contraseña" required>
        <button type="submit">Actualizar</button>
    </form>

    <div id="mensaje"></div>
    <div id="error"></div>
</div>

<script>
    // Obtener token de la URL
    const token = window.location.pathname.split("/").pop();

    document.getElementById("resetForm").addEventListener("submit", async function(e){
        e.preventDefault();

        const formData = new FormData(this);
        const password = formData.get("password");

        try {
            const res = await fetch(`/reset-password/${token}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            const texto = await res.text();

            if(res.ok){
                document.getElementById("mensaje").innerText = texto;
                document.getElementById("error").innerText = "";
            } else {
                document.getElementById("error").innerText = texto;
                document.getElementById("mensaje").innerText = "";
            }

        } catch(err){
            document.getElementById("error").innerText = "Error de conexión ❌";
        }
    });
</script>

</body>
</html>
