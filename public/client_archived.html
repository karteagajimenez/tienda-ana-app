<!DOCTYPE html>
<html lang="es">

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archivos Cliente - Tienda Ana</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fdf6f0,
                    #f8e1e7
                );

            color: #4b3f42;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px;
        }


        #header {

            width: 100%;
            max-width: 1200px;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            padding: 15px 20px;

            background-color: #fffaf8;

            border: 1px solid #f2d5dd;

            border-radius: 12px;

            box-shadow:
                0 4px 12px rgba(150, 90, 110, 0.12);

            margin-bottom: 30px;
        }


        #nombreCliente {

            font-weight: bold;

            font-size: 16px;

            color: #714f5b;

            margin-right: 20px;
        }


        #volver {

            background-color: #c48b9f;

            color: white;

            border: none;

            padding: 9px 17px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            margin-right: 10px;

            transition:
                background-color 0.3s,
                transform 0.2s;
        }


        #volver:hover {

            background-color: #b3748a;

            transform: translateY(-1px);
        }


        #cerrarSesion {

            background-color: #d95c68;

            color: white;

            border: none;

            padding: 9px 17px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition:
                background-color 0.3s,
                transform 0.2s;
        }


        #cerrarSesion:hover {

            background-color: #c94c59;

            transform: translateY(-1px);
        }


        .tabla-container {

            width: 100%;
            max-width: 1200px;

            background-color: #fffaf8;

            border: 1px solid #f1d4dc;

            border-radius: 12px;

            box-shadow:
                0 5px 18px rgba(150, 90, 110, 0.13);

            padding: 20px;
        }


        .titulo-seccion {

            margin-bottom: 15px;

            color: #714f5b;

            font-size: 20px;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            margin-top: 10px;

            overflow: hidden;
        }


        th,
        td {

            padding: 13px 15px;

            text-align: left;
        }


        th {

            background-color: #d990a4;

            color: white;

            font-weight: 600;

            font-size: 14px;
        }


        td {

            background-color: #fffdfc;

            border-bottom: 1px solid #f3e3e7;

            font-size: 14px;

            color: #55494d;
        }


        tbody tr:hover td {

            background-color: #fff4f6;
        }


        .estado {

            padding: 5px 10px;

            border-radius: 12px;

            font-size: 12px;

            font-weight: 600;

            color: white;

            display: inline-block;
        }


        .En_EEUU {
            background-color: #3498db;
        }


        .COLOMBIA {
            background-color: #e67e22;
        }


        .EN_CAMINO {
            background-color: #f39c12;
        }


        .COSTA_RICA {
            background-color: #8e44ad;
        }


        .EMPACADO {
            background-color: #16a085;
        }


        .ENTREGADO {
            background-color: #27ae60;
        }


        .sin-pedidos {

            text-align: center;

            color: #9a7d85;

            padding: 30px;

            font-size: 15px;
        }

        .menu-movil {
    display: none;
}

.acciones-escritorio {
    display: flex;
    align-items: center;
}

@media(max-width:700px){

    body {
        padding: 10px;
        overflow-x: hidden;
    }
/* ========================================
   MENÚ MÓVIL
======================================== */

.acciones-escritorio {
    display: none;
}

.menu-movil {
    display: block;

    position: absolute;
    top: 18px;
    right: 18px;

    z-index: 4000;
}


/* BOTÓN ☰ / X */

#botonMenuMovil {
    position: relative;
    z-index: 4001;

    background: transparent;
    color: #714f5b;

    border: none;

    padding: 6px 8px;

    font-size: 28px;
    line-height: 1;

    cursor: pointer;
}


/* PANEL LATERAL */

#menuMovilOpciones {
    display: none;

    position: fixed;

    top: 0;
    right: 0;

    width: 68%;
    max-width: 270px;
    height: 100vh;

    background: #fffaf8;

    border-left: 1px solid #f2d5dd;

    box-shadow:
        -8px 0 22px
        rgba(120, 70, 90, 0.22);

    padding: 20px 14px;

    box-sizing: border-box;

    z-index: 3000;

    overflow-y: auto;
}


/* LOGO CENTRADO */

.cabecera-menu-movil {
    width: 100%;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    box-sizing: border-box;
}

.logo-menu-movil {
    width: 65px;
    height: auto;

    border-radius: 8px;
}


/* BOTONES DEL MENÚ */

#menuMovilOpciones button {
    width: 76%;

    display: block;

    margin: 0 auto 9px auto;

    padding: 9px 10px;

    border: none;
    border-radius: 7px;

    font-size: 13px;
    font-weight: 600;

    text-align: center;

    cursor: pointer;
}


/* VOLVER */

#volverMovil {
    background-color: #c48b9f;
    color: white;
}


/* CERRAR SESIÓN */

#cerrarSesionMovil {
    background-color: #d95c68;
    color: white;
}

    /* ========================================
       HEADER MÓVIL
    ======================================== */

    #header {
        width: 100%;
        max-width: 100%;

        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;

        gap: 8px;

        padding: 12px;

        overflow-x: auto;
        overflow-y: hidden;

        -webkit-overflow-scrolling: touch;

        white-space: nowrap;
    }

    #nombreCliente {
        flex: 0 0 auto;

        margin-right: 5px;

        font-size: 14px;

        white-space: nowrap;
    }

    #miPerfil,
    #archivos,
    #cerrarSesion {
        flex: 0 0 auto;

        margin-right: 5px;

        padding: 8px 12px;

        font-size: 12px;

        white-space: nowrap;
    }


    /* ========================================
       TABLA DE ARCHIVADOS
    ======================================== */

    .tabla-container {
        width: 100%;
        max-width: 100%;

        padding: 12px;

        overflow-x: auto;
        overflow-y: hidden;

        -webkit-overflow-scrolling: touch;
    }

    table {
        width: 800px;
        min-width: 800px;

        table-layout: auto;

        white-space: nowrap;
    }

    th,
    td {
        padding: 10px 12px;

        font-size: 13px;

        white-space: nowrap;
    }


    /* ========================================
       BOTONES DE ARCHIVADOS
    ======================================== */

    .btn-detalles-archivado,
    .btn-desarchivar,
    .btn-eliminar-archivado {
        width: auto;
        min-width: 0;

        padding: 7px 9px;

        font-size: 12px;

        white-space: nowrap;
    }

}
    </style>

</head>


<body>

<div id="header">

    <span id="nombreCliente">
        👤 Cargando cliente...
    </span>


    <!-- ========================================
         BOTONES NORMALES - COMPUTADORA
    ======================================== -->

    <div class="acciones-escritorio">

        <button id="volver">
            Volver
        </button>

        <button id="cerrarSesion">
            Cerrar sesión
        </button>

    </div>


    <!-- ========================================
         MENÚ MÓVIL
    ======================================== -->

    <div class="menu-movil">

        <button
            id="botonMenuMovil"
            type="button"
            aria-label="Abrir menú"
        >
            ☰
        </button>


        <div id="menuMovilOpciones">

            <div class="cabecera-menu-movil">

                <img
                    src="logo.jpg"
                    alt="Logo Tienda Ana"
                    class="logo-menu-movil"
                >

            </div>


            <button
                id="volverMovil"
                type="button"
            >
                Volver
            </button>


            <button
                id="cerrarSesionMovil"
                type="button"
            >
                Cerrar sesión
            </button>

        </div>

    </div>
    </div>

</div>


<!-- ========================================
     FACTURAS ARCHIVADAS DEL CLIENTE
======================================== -->

<div class="tabla-container">

    <h2 class="titulo-seccion">
        Facturas archivadas
    </h2>

    <table>

        <thead>

            <tr>
                <th>Artículo</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Envío</th>
                <th>Abonado</th>
                <th>País</th>
                <th>Estado</th>
            </tr>

        </thead>

        <tbody id="tabla">

            <tr>

                <td
                    colspan="7"
                    class="sin-pedidos"
                >
                    Cargando archivos...
                </td>

            </tr>

        </tbody>

    </table>

</div>

<script>


// ========================================
// OBTENER ID DEL CLIENTE
// ========================================

const params =
    new URLSearchParams(
        window.location.search
    );

const id =
    params.get("id");


// ========================================
// TRADUCIR PAÍS
// ========================================

function traducirPaisOrigen(pais){

    switch(pais){

        case "EEUU":
            return "Estados Unidos";

        case "COLOMBIA":
            return "Colombia";

        default:
            return "-";

    }

}


// ========================================
// TRADUCIR ESTADO
// ========================================

function traducirEstado(e){

    switch(e){

        case "En_EEUU":

            return {
                texto: "Estados Unidos",
                clase: "En_EEUU"
            };


        case "COLOMBIA":

            return {
                texto: "Colombia",
                clase: "COLOMBIA"
            };


        case "EN_CAMINO":

            return {
                texto: "En camino",
                clase: "EN_CAMINO"
            };


        case "COSTA_RICA":

            return {
                texto: "Costa Rica",
                clase: "COSTA_RICA"
            };


        case "EMPACADO":

            return {
                texto: "Empacado",
                clase: "EMPACADO"
            };


        case "ENTREGADO":

            return {
                texto: "Entregado",
                clase: "ENTREGADO"
            };


        default:

            return {
                texto: e || "-",
                clase: ""
            };

    }

}

// ========================================
// MENÚ MÓVIL
// ========================================

const botonMenuMovil =
    document.getElementById(
        "botonMenuMovil"
    );

const menuMovilOpciones =
    document.getElementById(
        "menuMovilOpciones"
    );

botonMenuMovil.addEventListener(
    "click",
    () => {

        const abierto =
            menuMovilOpciones.style.display ===
            "block";

        if(abierto){

            menuMovilOpciones.style.display =
                "none";

            botonMenuMovil.innerText =
                "☰";

            botonMenuMovil.setAttribute(
                "aria-label",
                "Abrir menú"
            );

        }else{

            menuMovilOpciones.style.display =
                "block";

            botonMenuMovil.innerText =
                "✕";

            botonMenuMovil.setAttribute(
                "aria-label",
                "Cerrar menú"
            );

        }

    }
);


// ========================================
// VOLVER DESDE MENÚ MÓVIL
// ========================================

document.getElementById(
    "volverMovil"
).addEventListener(
    "click",
    () => {

        window.location.href =
            `/client.html?id=${encodeURIComponent(id)}`;

    }
);


// ========================================
// CERRAR SESIÓN DESDE MENÚ MÓVIL
// ========================================

document.getElementById(
    "cerrarSesionMovil"
).addEventListener(
    "click",
    () => {

        window.location.href =
            "/logout";

    }
);
// ========================================
// CARGAR NOMBRE DEL CLIENTE
// ========================================

async function cargarNombreCliente(){

    try{

        const respuesta =
            await fetch(
                `/user/${id}`
            );

        const usuario =
            await respuesta.json();

        const nombre =
            usuario.nombre || "";

        const apellido =
            usuario.apellido || "";

        const nombreCompleto =
            `${nombre} ${apellido}`.trim();


        document.getElementById(
            "nombreCliente"
        ).innerText =
            nombreCompleto
                ? "👤 " + nombreCompleto
                : "👤 Cliente";


    }catch(error){

        console.error(
            "Error cargando nombre:",
            error
        );

    }

}


// ========================================
// CARGAR PEDIDOS ARCHIVADOS
// ========================================

async function cargarArchivados(){

    try{

        const res =
            await fetch(
                `/client-archived-orders/${id}`
            );


        const data =
            await res.json();


        let html = "";


        if(data.length === 0){

            html = `

                <tr>

                    <td
                        colspan="7"
                        class="sin-pedidos"
                    >

                        No tienes facturas archivadas.

                    </td>

                </tr>

            `;

        }


        data.forEach(p => {


            const cantidad =
                Number(
                    p.cantidad
                ) || 0;


            const precioUnitario =
                Number(
                    p.precio_unidad
                ) || 0;


            const precioProducto =
                precioUnitario *
                cantidad;


            const envio =
                (
                    (p.peso_gramos || 0)
                    / 1000
                )
                * 6000;


            const paisOrigen =
                traducirPaisOrigen(
                    p.pais_origen
                );


            const estado =
                traducirEstado(
                    p.estado
                );


            html += `

                <tr>

                    <td>
                        ${p.articulo}
                    </td>

                    <td>
                        ${p.cantidad}
                    </td>

                    <td>
                        ₡${precioProducto.toLocaleString(
                            "es-CR"
                        )}
                    </td>

                    <td>
                        ₡${envio.toLocaleString(
                            "es-CR"
                        )}
                    </td>

                    <td>
                        ₡${Number(
                            p.total_abonado
                        ).toLocaleString(
                            "es-CR"
                        )}
                    </td>

                    <td>
                        ${paisOrigen}
                    </td>

                    <td>

                        <span
                            class="estado ${estado.clase}"
                        >

                            ${estado.texto}

                        </span>

                    </td>

                </tr>

            `;

        });


        document.getElementById(
            "tabla"
        ).innerHTML =
            html;


    }catch(error){

        console.error(
            "Error cargando archivados:",
            error
        );


        document.getElementById(
            "tabla"
        ).innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="sin-pedidos"
                >

                    No se pudieron cargar los archivos.

                </td>

            </tr>

        `;

    }

}


// ========================================
// VOLVER
// ========================================

document.getElementById(
    "volver"
).addEventListener(
    "click",
    () => {

        window.location.href =
            `/client.html?id=${encodeURIComponent(id)}`;

    }
);


// ========================================
// CERRAR SESIÓN
// ========================================

document.getElementById(
    "cerrarSesion"
).addEventListener(
    "click",
    () => {

        window.location.href =
            "/logout";

    }
);


// ========================================
// AUTO CIERRE TRAS 10 MINUTOS
// ========================================

setTimeout(
    () => {

        window.location.href =
            "/logout";

    },
    600000
);


// ========================================
// INICIAR
// ========================================

cargarNombreCliente();

cargarArchivados();


</script>


</body>

</html>
