<!DOCTYPE html>
<html lang="es">

<head>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">

<title>Artículos - Tienda Ana</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,#f8e1e7,#fdf6f0);
    margin:0;
    padding:0;
}


/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 25px;
    position:relative;
}

.header h1{
    font-size:22px;
    color:#c48b9f;
    margin:0;
}

.logo-container{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

.logo-header{
    height:90px;
}


/* BOTÓN VOLVER */

.volver{
    background:#b76e8a;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.volver:hover{
    opacity:0.85;
}


/* CONTENEDOR */

.contenedor{
    width:92%;
    max-width:1100px;
    margin:40px auto;
}

.tarjeta{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 3px 15px rgba(0,0,0,0.12);
}

.tarjeta h2{
    text-align:center;
    color:#c48b9f;
    margin-top:0;
    margin-bottom:25px;
}


/* BUSCADOR */

.buscador{
    margin-bottom:25px;
}

.buscador input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

.buscador input:focus{
    outline:none;
    border-color:#c48b9f;
    box-shadow:0 0 0 3px rgba(196,139,159,0.15);
}


/* TABLA */

.tabla-contenedor{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#c48b9f;
    color:white;
}

tbody tr:hover{
    background:#fdf6f8;
}


/* COLUMNAS */

.col-tasa{
    text-align:right;
    white-space:nowrap;
}

.col-accion{
    text-align:center;
    width:120px;
}


/* BOTÓN EDITAR */
/* BOTONES EDITAR Y ELIMINAR */

.editar,
.eliminar{
    width:72px;
    padding:6px 0;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
    display:block;
    margin-left:auto;
    margin-right:auto;
}

.editar{
    background:#c48b9f;
    color:white;
}

.editar:hover{
    background:#b3748a;
}

.eliminar{
    background:#e74c3c;
    color:white;
    margin-top:4px;
}

.eliminar:hover{
    opacity:0.85;
}
/* SIN RESULTADOS */

.sin-resultados{
    text-align:center;
    color:#888;
    padding:30px;
}

.modal-eliminar-articulo{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);

    justify-content:center;
    align-items:center;

    padding:20px;

    z-index:5000;
}

.modal-eliminar-articulo.activo{
    display:flex;
}

.modal-eliminar-contenido{
    width:100%;
    max-width:390px;

    background:white;

    border-radius:16px;

    padding:28px;

    text-align:center;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.20);
}

.modal-eliminar-icono{
    width:58px;
    height:58px;

    margin:0 auto 14px;

    border-radius:50%;

    background:#fde8e8;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:26px;
}

.modal-eliminar-contenido h3{
    margin:0 0 12px;

    color:#e74c3c;

    font-size:22px;
}

.modal-eliminar-contenido p{
    color:#666;

    font-size:14px;

    line-height:1.6;
}

.modal-eliminar-botones{
    display:flex;
    justify-content:center;

    gap:10px;

    margin-top:22px;
}

.modal-eliminar-botones button{
    min-width:115px;

    padding:10px 18px;

    border:none;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;
}

.btn-cancelar-eliminar{
    background:#e5e5e5;

    color:#333;
}

.btn-confirmar-eliminar{
    background:#e74c3c;

    color:white;
}

.btn-cancelar-eliminar:hover,
.btn-confirmar-eliminar:hover{
    opacity:0.85;
}

.mensaje-exito{
    position:fixed;
    top:25px;
    left:50%;

    transform:
        translateX(-50%)
        translateY(-20px);

    background:white;
    color:#444;

    padding:16px 24px;
    border-radius:12px;

    box-shadow:
        0 6px 22px
        rgba(0,0,0,0.22);

    font-weight:bold;
    font-size:15px;

    opacity:0;
    visibility:hidden;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;

    z-index:6000;
}

.mensaje-exito.activo{
    opacity:1;
    visibility:visible;

    transform:
        translateX(-50%)
        translateY(0);
}

/* PAGINACIÓN */

.paginacion{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    width:100%;
    margin-top:18px;

    gap:8px;
}

.rango-paginacion{
    width:100%;
    text-align:center;

    color:#333;

    font-size:14px;
    font-weight:bold;
}

.botones-paginacion{
    display:flex;
    justify-content:center;
    align-items:center;

    gap:8px;
}

.botones-paginacion button{
    background:#c48b9f;
    color:white;

    border:none;
    border-radius:6px;

    padding:7px 13px;

    cursor:pointer;
    font-weight:bold;
}

.botones-paginacion button:hover{
    background:#b3748a;
}

.botones-paginacion button:disabled{
    display:none;
}

/* RESPONSIVE */

@media(max-width:700px){

    .header h1{
        display:none;
    }

    .logo-container{
        position:static;
        transform:none;
    }

    .contenedor{
        width:95%;
    }

    .tarjeta{
        padding:20px;
    }

}

</style>

</head>


<body>


<div class="header">

    <h1>
        📦 Artículos
    </h1>

    <div class="logo-container">

        <img
            src="logo.jpg"
            class="logo-header"
            alt="Tienda Ana"
        >

    </div>


    <button
        class="volver"
        onclick="volver()"
    >
        Volver
    </button>

</div>



<div class="contenedor">

    <div class="tarjeta">

        <h2>
            Lista de artículos
        </h2>


        <div class="buscador">

            <input
                type="text"
                id="buscar"
                placeholder="Buscar artículo..."
                autocomplete="off"
            >

        </div>

<div class="tabla-contenedor">

    <table>

        <thead>

            <tr>

                <th>
                    Nombre del artículo
                </th>

                <th>
                    Tasa
                </th>

                <th>
                    Descripción
                </th>

                <th class="col-accion">
                    Acción
                </th>

            </tr>

        </thead>


        <tbody id="tablaArticulos">

            <tr>

                <td
                    colspan="4"
                    class="sin-resultados"
                >
                    Cargando artículos...
                </td>

            </tr>

        </tbody>

    </table>

</div>


<div class="paginacion">

    <div
        id="rangoPaginacion"
        class="rango-paginacion"
    >
        0 - 0 de 0
    </div>

    <div class="botones-paginacion">

        <button
            id="btnAnterior"
            type="button"
            onclick="paginaAnterior()"
        >
            Anterior
        </button>

        <button
            id="btnSiguiente"
            type="button"
            onclick="paginaSiguiente()"
        >
            Siguiente
        </button>

    </div>

</div>

    </div>

</div>


<div
    id="modalEliminarArticulo"
    class="modal-eliminar-articulo"
>
    <div class="modal-eliminar-contenido">

        <div class="modal-eliminar-icono">
            🗑️
        </div>

        <h3>
            Eliminar artículo
        </h3>

        <p id="mensajeEliminarArticulo">
            ¿Está seguro de que desea eliminar este artículo?
        </p>

        <div class="modal-eliminar-botones">

            <button
                type="button"
                class="btn-cancelar-eliminar"
                onclick="cerrarModalEliminarArticulo()"
            >
                Cancelar
            </button>

            <button
                type="button"
                class="btn-confirmar-eliminar"
                onclick="confirmarEliminarArticulo()"
            >
                Eliminar
            </button>

        </div>

    </div>

</div>


<div
    id="mensajeExito"
    class="mensaje-exito"
>
</div>


<script>


let articulos = [];

let paginaActual = 1;

const articulosPorPagina = 20;

let articulosFiltrados = [];


/* ================================
   VOLVER
================================ */

function volver(){

    window.location.href =
        "/add_article.html";

}



/* ================================
   FORMATEAR DINERO
================================ */

function moneda(valor){

    return "₡" +
        Number(valor || 0)
        .toLocaleString(
            "es-CR",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}



/* ================================
   NORMALIZAR TEXTO
================================ */

function normalizar(texto){

    return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();

}



/* ================================
   CARGAR ARTÍCULOS
================================ */

async function cargarArticulos(){

    try{

        const respuesta =
            await fetch(
                "/articulos"
            );


        articulos =
            await respuesta.json();


        mostrarArticulos(
            articulos
        );


    }catch(error){

        console.error(
            "Error cargando artículos:",
            error
        );


        document.getElementById(
            "tablaArticulos"
        ).innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="sin-resultados"
                >
                    No se pudieron cargar los artículos.
                </td>

            </tr>

        `;

    }

}



/* ================================
   MOSTRAR ARTÍCULOS
================================ */

function mostrarArticulos(lista){

    const tabla =
        document.getElementById(
            "tablaArticulos"
        );


    tabla.innerHTML = "";


    if(lista.length === 0){

        tabla.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="sin-resultados"
                >
                    No hay artículos registrados.
                </td>

            </tr>

        `;

        return;

    }
articulosFiltrados = lista;

const inicio =
    (paginaActual - 1) *
    articulosPorPagina;

const fin =
    inicio +
    articulosPorPagina;

const articulosPagina =
    lista.slice(
        inicio,
        fin
    );

    articulosPagina.forEach(
        articulo => {


            const fila =
                document.createElement(
                    "tr"
                );


            const tdNombre =
                document.createElement(
                    "td"
                );

            tdNombre.textContent =
                articulo.nombre || "-";


            const tdTasa =
                document.createElement(
                    "td"
                );

            tdTasa.className =
                "col-tasa";

            tdTasa.textContent =
                moneda(
                    articulo.tasa
                );


            const tdDescripcion =
                document.createElement(
                    "td"
                );

            tdDescripcion.textContent =
                articulo.descripcion ||
                "-";


            const tdAccion =
                document.createElement(
                    "td"
                );

            tdAccion.className =
                "col-accion";


            const botonEditar =
                document.createElement(
                    "button"
                );

            botonEditar.className =
                "editar";

            botonEditar.textContent =
                "Editar";

            botonEditar.addEventListener(
                "click",
                () => {

                    editarArticulo(
                        articulo.id_articulo
                    );

                }
            );


            tdAccion.appendChild(
                botonEditar
            );
const botonEliminar =
    document.createElement(
        "button"
    );

botonEliminar.className =
    "eliminar";

botonEliminar.textContent =
    "Eliminar";

botonEliminar.addEventListener(
    "click",
    () => {

        eliminarArticulo(
            articulo.id_articulo,
            articulo.nombre,
            articulo.descripcion
        );

    }
);

tdAccion.appendChild(
    botonEliminar
);

            fila.appendChild(
                tdNombre
            );

            fila.appendChild(
                tdTasa
            );

            fila.appendChild(
                tdDescripcion
            );

            fila.appendChild(
                tdAccion
            );


            tabla.appendChild(
                fila
            );

        }
    );
actualizarPaginacion();
}

/* ================================
   PAGINACIÓN
================================ */

function actualizarPaginacion(){

    const total =
        articulosFiltrados.length;

    const rango =
        document.getElementById(
            "rangoPaginacion"
        );

    const btnAnterior =
        document.getElementById(
            "btnAnterior"
        );

    const btnSiguiente =
        document.getElementById(
            "btnSiguiente"
        );


    if(total === 0){

        rango.textContent =
            "0 - 0 de 0";

        btnAnterior.disabled =
            true;

        btnSiguiente.disabled =
            true;

        return;
    }


    const inicio =
        (paginaActual - 1) *
        articulosPorPagina + 1;

    const fin =
        Math.min(
            paginaActual *
            articulosPorPagina,
            total
        );


    rango.textContent =
        `${inicio} - ${fin} de ${total}`;


    btnAnterior.disabled =
        paginaActual === 1;

    btnSiguiente.disabled =
        fin >= total;

}


function paginaAnterior(){

    if(paginaActual <= 1){
        return;
    }

    paginaActual--;

    mostrarArticulos(
        articulosFiltrados
    );

    actualizarPaginacion();

}


function paginaSiguiente(){

    const totalPaginas =
        Math.ceil(
            articulosFiltrados.length /
            articulosPorPagina
        );

    if(
        paginaActual >= totalPaginas
    ){
        return;
    }

    paginaActual++;

    mostrarArticulos(
        articulosFiltrados
    );

    actualizarPaginacion();

}

/* ================================
   BUSCADOR
================================ */

document.getElementById(
    "buscar"
).addEventListener(
    "input",
    function(){


        const texto =
            normalizar(
                this.value
            );


        const resultados =
            articulos.filter(
                articulo => {


                    const nombre =
                        normalizar(
                            articulo.nombre
                        );


                    const descripcion =
                        normalizar(
                            articulo.descripcion
                        );


                    return (
                        nombre.includes(texto) ||
                        descripcion.includes(texto)
                    );

                }
            );

         paginaActual = 1;
        mostrarArticulos(
            resultados
        );

    }
);



/* ================================
   EDITAR ARTÍCULO
================================ */

function editarArticulo(
    idArticulo
){

    window.location.href =
        `/edit_article.html?id=${idArticulo}`;

}

let articuloParaEliminar = null;


function eliminarArticulo(
    idArticulo,
    nombre,
    descripcion
){

    articuloParaEliminar =
        Number(idArticulo);

    const mensaje =
        document.getElementById(
            "mensajeEliminarArticulo"
        );

    mensaje.innerHTML = `
        ¿Está seguro de que desea eliminar
        <strong>${nombre}</strong>
        ${
            descripcion
                ? `<br><br>Descripción: <strong>${descripcion}</strong>`
                : ""
        }?
    `;

    document.getElementById(
        "modalEliminarArticulo"
    ).classList.add(
        "activo"
    );

}


function cerrarModalEliminarArticulo(){

    articuloParaEliminar =
        null;

    document.getElementById(
        "modalEliminarArticulo"
    ).classList.remove(
        "activo"
    );

}

function mostrarMensajeExito(texto){

    const mensaje =
        document.getElementById(
            "mensajeExito"
        );

    mensaje.textContent =
        "✓ " + texto;

    mensaje.classList.add(
        "activo"
    );

    setTimeout(
        () => {

            mensaje.classList.remove(
                "activo"
            );

        },
        2500
    );

}

async function confirmarEliminarArticulo(){

    if(
        !articuloParaEliminar
    ){
        return;
    }

    try{

        const respuesta =
            await fetch(
                "/delete-article",
                {
                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            id_articulo:
                                articuloParaEliminar
                        })
                }
            );

        const data =
            await respuesta.json();


        if(
            !respuesta.ok ||
            !data.ok
        ){

            alert(
                data.mensaje ||
                "No se pudo eliminar el artículo"
            );

            return;
        }


        cerrarModalEliminarArticulo();

        await cargarArticulos();

     mostrarMensajeExito(
    "Artículo eliminado exitosamente"
);


    }catch(error){

        console.error(
            "Error eliminando artículo:",
            error
        );

        alert(
            "No se pudo eliminar el artículo"
        );

    }

}


/* ================================
   INICIO
================================ */

cargarArticulos();


</script>


</body>

</html>
