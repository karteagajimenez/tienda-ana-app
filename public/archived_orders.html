<!DOCTYPE html>
<html lang="es">

<head>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">

<title>Pedidos Archivados</title>

<style>
.paginacion-clientes {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 14px 0;
    margin: 0;
    background: #fdf6f0;
    font-weight: bold;
    color: #555;
    z-index: 900;
}
.paginacion-clientes button {
    background: #c58aa0;
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}

.paginacion-clientes button:hover {
    background: #ad6f87;
}

.paginacion-clientes span {
    font-size: 16px;
    font-weight: bold;
    color: #555;
}
body {
    font-family: Arial;
    background: linear-gradient(to right, #f8e1e7, #fdf6f0);
    margin: 0;
}

.btn-desarchivar {
    background: #6fa88b;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-right: 6px;
}

.btn-desarchivar:hover {
    opacity: 0.85;
}
/* =========================================================
   MODAL ELIMINAR ARCHIVADO
========================================================= */

.modal-eliminar-bonito {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 9999;
}

.modal-eliminar-contenido {
    width: 100%;
    max-width: 390px;
    background: white;
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.20);
}

.modal-eliminar-icono {
    width: 58px;
    height: 58px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: #fde8e8;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
}

.modal-eliminar-contenido h3 {
    margin: 0 0 12px;
    color: #e74c3c;
    font-size: 22px;
}

.modal-eliminar-contenido p {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
}

.modal-eliminar-botones {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
}

.modal-eliminar-botones button {
    min-width: 115px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.btn-cancelar-eliminar {
    background: #e5e5e5;
    color: #333;
}

.btn-confirmar-eliminar {
    background: #e74c3c;
    color: white;
}

.btn-cancelar-eliminar:hover,
.btn-confirmar-eliminar:hover {
    opacity: 0.85;
}
.modal-desarchivar {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 9999;
}

.modal-desarchivar.activo {
    display: flex;
}

.modal-desarchivar-contenido {
    width: 100%;
    max-width: 390px;
    background: white;
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.20);
}

.modal-desarchivar-icono {
    width: 58px;
    height: 58px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: #f8e1e7;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
}

.modal-desarchivar-contenido h3 {
    margin: 0 0 12px;
    color: #c48b9f;
    font-size: 22px;
}

.modal-desarchivar-contenido p {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
}

.modal-desarchivar-botones {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
}

.modal-desarchivar-botones button {
    min-width: 115px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.btn-cancelar-desarchivar {
    background: #e5e5e5;
    color: #333;
}

.btn-confirmar-desarchivar {
    background: #6fa88b;
    color: white;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 25px;
    position: relative;
}

.header h1 {
    font-size: 22px;
    color: #c48b9f;
    margin: 0;
}


/* =========================================================
   LOGO
========================================================= */

.logo-container {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}

.logo {
    height: 90px;
}


/* =========================================================
   BOTONES HEADER
========================================================= */

.header-buttons button {
    background: #b76e8a;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 6px;
    cursor: pointer;
    margin-left: 8px;
    font-weight: bold;
}

.header-buttons button:last-child {
    background: #e74c3c;
}

.header-buttons button:hover {
    opacity: 0.85;
}
.menu-movil {
    display: none;
}


/* =========================================================
   BUSCADOR
========================================================= */

#buscar {
    width: 100%;
    max-width: 500px;
    padding: 12px;
    margin: 20px auto;
    display: block;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
}


/* =========================================================
   TABLA
========================================================= */

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th,
td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

th {
    background: #c48b9f;
    color: white;
}


/* =========================================================
   SALDO
========================================================= */

.saldo-pendiente {
    color: #e74c3c;
    font-weight: bold;
}

.saldo-pagado {
    color: #2ecc71;
    font-weight: bold;
}


/* =========================================================
   SIN ARCHIVADOS
========================================================= */

.sin-archivados {
    padding: 35px;
    color: #777;
    font-size: 16px;
    text-align: center;
}


/* =========================================================
   FECHA ARCHIVADO
========================================================= */

.fecha-archivado {
    color: #a85c78;
    font-weight: bold;
}

/* =========================================================
   BOTÓN DETALLES
========================================================= */

.btn-detalles-archivado {
    background: #c48b9f;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-right: 6px;
}

.btn-detalles-archivado:hover {
    opacity: 0.85;
}

/* =========================================================
   BOTÓN ELIMINAR
========================================================= */

.btn-eliminar-archivado {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn-eliminar-archivado:hover {
    opacity: 0.85;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
    z-index: 3000;
}

.modal-content {
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 90%;
    max-width: 420px;
    text-align: center;
}

.modal-content h3 {
    margin-top: 0;
    color: #c48b9f;
}

.modal-content .ok,
.modal-content .cancel {
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px;
}

.modal-content .ok {
    background: #e74c3c;
    color: white;
}

.modal-content .cancel {
    background: #aaa;
    color: white;
}

@media (max-width: 768px) {

    /* =========================================================
       PÁGINA MÓVIL
    ========================================================= */

    html,
    body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        overflow-x: hidden;
    }

    body {
        background:
            linear-gradient(
                to right,
                #f8e1e7,
                #fdf6f0
            );
    }


    /* =========================================================
       HEADER MÓVIL
       IGUAL QUE GESTIÓN DE PEDIDOS
    ========================================================= */

    .header {
        width: 100%;
        max-width: 100%;

        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;

        gap: 12px;

        padding: 12px 10px;
        box-sizing: border-box;

        overflow-x: auto;
        overflow-y: hidden;

        -webkit-overflow-scrolling: touch;

        white-space: nowrap;
    }


    /* TÍTULO */

    .header h1 {
        position: static;

        flex: 0 0 auto;

        width: auto;

        margin: 0;
        padding: 0;

        font-size: 18px;
        line-height: 1.2;

        white-space: nowrap;
    }


    /* LOGO */

    .logo-container {
        position: static;

        flex: 0 0 auto;

        left: auto;
        right: auto;
        top: auto;

        transform: none;
    }

    .logo {
        height: 58px;
        width: auto;
    }


    /* =========================================================
       BOTONES SUPERIORES
       TODOS EN UNA SOLA FILA
    ========================================================= */

    .header-buttons {
        position: static;

        flex: 0 0 auto;

        display: none;
        flex-direction: row;
        flex-wrap: nowrap;

        align-items: center;

        gap: 5px;

        width: auto;

        margin: 0;
        padding: 0;

        overflow: visible;
    }

    .header-buttons button {
        flex: 0 0 auto;

        width: auto;
        min-width: 0;

        margin: 0;

        padding: 7px 9px;

        font-size: 11px;

        white-space: nowrap;
    }
/* =========================================================
   MENÚ MÓVIL
========================================================= */

.menu-movil {
    display: block;
    position: absolute;
    top: 18px;
    right: 18px;
    z-index: 4000;
}

#botonMenuMovil {
    position: relative;
    z-index: 4001;

    background: transparent;
    color: #714f5b;
    border: none;

    padding: 6px 8px;

    font-size: 28px;
    line-height: 1;

    cursor: pointer;
}

#menuMovilOpciones {
    display: none;

    position: fixed;
    top: 0;
    right: 0;

    width: 68%;
    max-width: 270px;
    height: 100vh;

    background: #fffaf8;
    border-left: 1px solid #f2d5dd;

    box-shadow:
        -8px 0 22px
        rgba(120, 70, 90, 0.22);

    padding: 20px 14px;

    box-sizing: border-box;

    z-index: 3000;

    overflow-y: auto;
}

.cabecera-menu-movil {
    width: 100%;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    box-sizing: border-box;
}

.logo-menu-movil {
    width: 65px;
    height: auto;
    border-radius: 8px;
}

#menuMovilOpciones button {
    width: 76%;

    display: block;

    margin: 0 auto 9px auto;
    padding: 9px 10px;

    border: none;
    border-radius: 7px;

    font-size: 13px;
    font-weight: 600;

    text-align: center;
    cursor: pointer;

    background: #b76e8a;
    color: white;
}

#cerrarSesionMovil {
    background: #e74c3c !important;
}

    /* =========================================================
       BUSCADOR
    ========================================================= */

    #buscar {
        width: calc(100% - 24px);
        max-width: 500px;

        margin: 15px auto;

        box-sizing: border-box;
    }


    /* =========================================================
       TABLA PRINCIPAL DE CLIENTES
    ========================================================= */

    body > table {
        width: 100%;
        min-width: 100%;

        table-layout: auto;
    }


    /* =========================================================
       ACORDEÓN ARCHIVADO
       DESPLAZAMIENTO INDEPENDIENTE
    ========================================================= */

    [id^="detalle-cliente-archivado-"] > td {
        width: 100%;
        max-width: 100vw;

        padding: 0;

        overflow: hidden;
    }

    [id^="contenido-cliente-archivado-"] {
        display: block;

        width: 100%;
        max-width: 100vw;

        overflow-x: auto;
        overflow-y: hidden;

        -webkit-overflow-scrolling: touch;
    }


    /* TABLA INTERNA */

    [id^="contenido-cliente-archivado-"] > table {
        width: 1050px !important;
        min-width: 1050px;

        table-layout: auto;

        white-space: nowrap;
    }


    [id^="contenido-cliente-archivado-"] th,
    [id^="contenido-cliente-archivado-"] td {
        padding: 9px 10px;

        font-size: 13px;

        white-space: nowrap;
        word-break: normal;

        vertical-align: middle;
    }


    /* =========================================================
       BOTONES DE ACCIONES ARCHIVADAS
    ========================================================= */

    [id^="contenido-cliente-archivado-"] td button {
        width: auto;
        min-width: 0;

        padding: 7px 9px;

        margin: 2px;

        font-size: 12px;

        white-space: nowrap;
    }


    /* =========================================================
       MODALES EN TELÉFONO
    ========================================================= */

    .modal-content,
    .modal-desarchivar-contenido,
    .modal-eliminar-contenido {
        width: calc(100% - 30px);
        max-width: 390px;

        box-sizing: border-box;
    }

}
/* =========================================================
   ESPACIO PARA PAGINACIÓN
   CELULAR Y COMPUTADORA
========================================================= */

body {
    padding-bottom: 90px;
    box-sizing: border-box;
}


/* =========================================================
   ZONA SUPERIOR FIJA - COMPUTADORA Y CELULAR
========================================================= */

.zona-superior-fija {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    z-index: 3000;

    background: linear-gradient(
        to right,
        #f8e1e7,
        #fdf6f0
    );
}


/* ESPACIO PARA QUE LOS CLIENTES
   EMPIECEN DEBAJO DE LA PARTE FIJA */

body > table {
    margin-top: 190px;
}


/* =========================================================
   BARRA CLIENTE FIJA
========================================================= */

.barra-cliente-fija {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;

    background: #c48b9f;
    color: white;

    text-align: center;
    font-weight: bold;
}


/* OCULTAR ENCABEZADO ORIGINAL DE LA TABLA */

body > table > thead {
    display: none;
}


/* =========================================================
   FICHAS DE PEDIDO - IGUAL A GESTION DE PEDIDOS
========================================================= */

.ficha-pedido-modal {
    width: 100%;
    box-sizing: border-box;
    background: #ffffff;
    border: 1px solid #eadde2;
    border-radius: 12px;
    overflow: hidden;
}

/* INFORMACION SUPERIOR */

.ficha-pedido-superior {
    display: grid;
    grid-template-columns: minmax(280px, 2fr) minmax(150px, 1fr) minmax(190px, 1fr);
    align-items: stretch;
    background: #fdf6f8;
    border-bottom: 1px solid #eadde2;
}

.ficha-cliente {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 25px;
}

.ficha-icono-cliente {
    width: 48px;
    height: 48px;
    min-width: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #f3dce4;
    font-size: 23px;
}

.ficha-nombre {
    font-size: 19px;
    font-weight: 700;
    color: #333333;
    margin-bottom: 5px;
}

.ficha-pais {
    font-size: 13px;
    color: #777777;
}

.ficha-factura,
.ficha-registro {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 18px 22px;
    border-left: 1px solid #eadde2;
}

.ficha-factura span,
.ficha-registro span {
    display: block;
    color: #8a6b76;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
}

.ficha-factura strong,
.ficha-registro strong {
    color: #333333;
    font-size: 18px;
}


/* DATOS DEL PEDIDO */

.ficha-datos {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    padding: 25px 20px;
    background: #ffffff;
}

.ficha-dato {
    min-width: 0;
    text-align: center;
    padding: 5px 12px;
    border-right: 1px solid #eeeeee;
}

.ficha-dato:last-child {
    border-right: none;
}

.ficha-dato span {
    display: block;
    margin-bottom: 9px;
    color: #8a6b76;
    font-size: 13px;
    font-weight: 700;
}

.ficha-dato strong {
    display: block;
    color: #333333;
    font-size: 15px;
    line-height: 1.35;
}

.ficha-dato strong.saldo-pendiente {
    color: #c62828;
}

.ficha-dato strong.saldo-pagado {
    color: #2e7d32;
}


/* ACCIONES */

.ficha-acciones {
    border-top: 1px solid #eadde2;
}

.ficha-acciones-titulo {
    padding: 11px 20px;
    background: #f3dce4;
    color: #684d57;
    font-size: 14px;
    font-weight: 700;
}

.ficha-botones {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 18px 20px 22px;
    background: #ffffff;
}

.ficha-botones button {
    width: auto !important;
    min-width: 105px;
    margin: 0 !important;
    padding: 9px 15px !important;
    white-space: nowrap;
}

.ficha-sin-factura {
    color: #888888;
    font-size: 13px;
}


/* EVITAR EL ANCHO ANTIGUO DEL ACORDEON */

#contenidoModalDetalleCliente .ficha-pedido-modal {
    position: static !important;
    left: auto !important;
    margin-left: 0 !important;
    max-width: 100% !important;
}


/* MOVIL */

@media (max-width: 768px) {

    .ficha-pedido-superior {
        grid-template-columns: 1fr;
    }

    .ficha-factura,
    .ficha-registro {
        border-left: none;
        border-top: 1px solid #eadde2;
    }

    .ficha-datos {
        grid-template-columns: repeat(2, 1fr);
        padding: 15px;
    }

    .ficha-dato {
        border-right: none;
        border-bottom: 1px solid #eeeeee;
        padding: 14px 8px;
    }

    .ficha-botones {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }

    .ficha-botones button {
        width: 100% !important;
        min-width: 0;
    }
}

/* =========================================================
   AJUSTE FINAL - DETALLE DEL PEDIDO
========================================================= */

@media (min-width: 769px) {

    /* MODAL MAS CORTO Y CENTRADO */
    .modal-detalle-contenido {
        width: min(1250px, 88vw) !important;
        max-width: 1250px !important;
    }

    .contenido-modal-detalle {
        padding: 22px 26px 26px !important;
        overflow-x: hidden !important;
    }


    /* PARTE SUPERIOR */
    .ficha-pedido-superior {
        grid-template-columns: 1.45fr 0.75fr 0.85fr !important;
        background: #ffffff !important;
    }

    .ficha-cliente {
        padding: 20px 22px !important;
    }

    .ficha-icono-cliente {
        width: 52px !important;
        height: 52px !important;
        min-width: 52px !important;
        background: #f1d3dd !important;
    }

    .ficha-nombre {
        font-size: 20px !important;
    }

    .ficha-factura,
    .ficha-registro {
        padding: 18px 22px !important;
    }


    /* DATOS COMO CUADROS */
    .ficha-datos {
        padding: 0 !important;
        grid-template-columns: repeat(6, 1fr) !important;
        border-top: 18px solid #ffffff;
    }

    .ficha-dato {
        padding: 0 !important;
        border-right: 1px solid #d8c6cc !important;
        border-bottom: 1px solid #d8c6cc !important;
    }

    .ficha-dato:first-child {
        border-left: 1px solid #d8c6cc !important;
    }

    .ficha-dato span {
        margin: 0 !important;
        padding: 11px 7px !important;

        background: #b65f7d !important;
        color: #ffffff !important;

        font-size: 14px !important;
        font-weight: 700 !important;
    }

    .ficha-dato strong {
        min-height: 64px;

        display: flex !important;
        align-items: center;
        justify-content: center;

        padding: 10px 7px !important;

        background: #ffffff !important;

        font-size: 15px !important;
        box-sizing: border-box;
    }


    /* ACCIONES */
    .ficha-acciones {
        margin-top: 18px !important;
        border: 1px solid #dfcbd2 !important;
        border-radius: 8px !important;
        overflow: hidden !important;
    }

    .ficha-acciones-titulo {
        padding: 11px 18px !important;

        background: #b65f7d !important;
        color: #ffffff !important;

        font-size: 15px !important;
        font-weight: 700 !important;
    }

    .ficha-botones {
        display: grid !important;
        grid-template-columns: repeat(7, 1fr) !important;
        gap: 9px !important;

        padding: 17px 18px !important;
    }

    .ficha-botones button {
        width: 100% !important;
        min-width: 0 !important;

        padding: 10px 6px !important;

        font-size: 14px !important;
        font-weight: 500 !important;
    }

}


/* TITULO DEL MODAL CON ROSA FUERTE */
.modal-detalle-cabecera {
    background: #b65f7d !important;
}


/* MOVIL */
@media (max-width: 768px) {

    .ficha-pedido-superior {
        background: #ffffff !important;
    }

<script>
// ========================================
// MENÚ MÓVIL
// ========================================

const botonMenuMovil =
    document.getElementById(
        "botonMenuMovil"
    );

const menuMovilOpciones =
    document.getElementById(
        "menuMovilOpciones"
    );

botonMenuMovil.addEventListener(
    "click",
    () => {

        const abierto =
            menuMovilOpciones.style.display ===
            "block";

        if(abierto){

            menuMovilOpciones.style.display =
                "none";

            botonMenuMovil.innerText =
                "☰";

            botonMenuMovil.setAttribute(
                "aria-label",
                "Abrir menú"
            );

        }else{

            menuMovilOpciones.style.display =
                "block";

            botonMenuMovil.innerText =
                "✕";

            botonMenuMovil.setAttribute(
                "aria-label",
                "Cerrar menú"
            );

        }

    }
);
// ======================================================
// 🔹 CERRAR MENÚ MÓVIL AL TOCAR FUERA
// ======================================================

document.addEventListener("click", (event) => {

    const menuAbierto =
        menuMovilOpciones.style.display === "block";

    if (!menuAbierto) {
        return;
    }

    // Si tocó dentro del menú o en ☰ / ✕,
    // no cerrarlo desde aquí
    if (
        menuMovilOpciones.contains(event.target) ||
        botonMenuMovil.contains(event.target)
    ) {
        return;
    }

    // Cerrar menú
    menuMovilOpciones.style.display =
        "none";

    // Restaurar ☰
    botonMenuMovil.innerText =
        "☰";

    botonMenuMovil.setAttribute(
        "aria-label",
        "Abrir menú"
    );

});

/* =========================================================
   VARIABLES
========================================================= */

let pedidosArchivados = [];

let archivadosPorCliente = {};

/* =========================================================
   TRADUCIR ESTADOS
========================================================= */

function traducirEstado(estado){

    switch(estado){

        case "En_EEUU":
            return "Estados Unidos";

        case "EN_CAMINO":
            return "En camino";

        case "COSTA_RICA":
            return "Costa Rica";

        case "EMPACADO":
            return "Empacado";

        case "ENTREGADO":
            return "Entregado";

        default:
            return estado || "-";

    }

}


/* =========================================================
   FORMATEAR DINERO
========================================================= */

function moneda(valor){

    return "₡" +
        Number(valor || 0)
        .toLocaleString(
            "es-CR",
            {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            }
        ).replace(/[\u00A0\u202F ]/g, ".");

}


/* =========================================================
   FORMATEAR FECHA
========================================================= */

function formatearFecha(fecha){

    if(!fecha){
        return "-";
    }

    return String(fecha).split("T")[0];

}


/* =========================================================
   CARGAR PEDIDOS ARCHIVADOS
========================================================= */

async function cargarArchivados(){

    try{

        const respuesta =
            await fetch(
                "/archived-orders"
            );


        if(!respuesta.ok){

            console.error(
                "Error cargando archivados"
            );

            return;

        }


        const data =
            await respuesta.json();


        pedidosArchivados =
            data;


        archivadosPorCliente =
            {};


        /* =================================================
           AGRUPAR POR CLIENTE Y FACTURA
        ================================================= */

        data.forEach(pedido => {

            const idUsuario =
                Number(
                    pedido.id_usuario
                );


            if(
                !archivadosPorCliente[
                    idUsuario
                ]
            ){

                archivadosPorCliente[
                    idUsuario
                ] = {

                    id_usuario:
                        idUsuario,

                    nombre:
                        pedido.nombre,

                    apellido:
                        pedido.apellido,

                    grupos:
                        {}

                };

            }


            const cliente =
                archivadosPorCliente[
                    idUsuario
                ];


            /* =============================================
               IDENTIFICAR FACTURA / GRUPO
            ============================================= */

            let claveGrupo;


            if(
                pedido.grupo_compra !== null &&
                pedido.grupo_compra !== undefined
            ){

                claveGrupo =
                    String(
                        Number(
                            pedido.grupo_compra
                        )
                    );

            }else{

                /*
                    Pedido antiguo sin grupo.
                    Se mantiene separado para no mezclarlo
                    con otros pedidos archivados.
                */

                claveGrupo =
                    `legacy-${pedido.id_pedido}`;

            }


            if(
                !cliente.grupos[
                    claveGrupo
                ]
            ){

                cliente.grupos[
                    claveGrupo
                ] = {

                    grupo_compra:
                        pedido.grupo_compra !== null &&
                        pedido.grupo_compra !== undefined
                            ? Number(
                                pedido.grupo_compra
                            )
                            : null,

                    numero_factura:
                        pedido.numero_factura !== null &&
                        pedido.numero_factura !== undefined
                            ? Number(
                                pedido.numero_factura
                            )
                            : null,

                    pais_origen:
                        pedido.pais_origen || null,

                    peso_total:
                        0,

                    envio_total:
                        0,

                    total_abonado:
                        0,

                    fecha_abono:
                        null,

                    fecha_archivado:
                        null,

                    estados:
                        new Set(),

                    pedidos:
                        []

                };

            }


            const grupo =
                cliente.grupos[
                    claveGrupo
                ];


            grupo.pedidos.push(
                pedido
            );


            /* =============================================
               PESO
            ============================================= */

            const peso =
                Number(
                    pedido.peso_gramos
                ) || 0;


            grupo.peso_total +=
                peso;


            /* =============================================
               VALOR ENVÍO
            ============================================= */

            const pesoRedondeado =
    Math.floor(peso / 100) * 100 +
    ((peso % 100) < 25 ? 0 : (peso % 100) <= 55 ? 50 : 100);

const envio = (pesoRedondeado / 1000) * 6000;


            grupo.envio_total +=
                envio;


            /* =============================================
               ABONO
            ============================================= */

            grupo.total_abonado +=
                Number(
                    pedido.total_abonado
                ) || 0;


            /* =============================================
               ESTADO
            ============================================= */

            if(pedido.estado){

                grupo.estados.add(
                    pedido.estado
                );

            }


            /* =============================================
               PAÍS DE ORIGEN
            ============================================= */

            if(
                !grupo.pais_origen &&
                pedido.pais_origen
            ){

                grupo.pais_origen =
                    pedido.pais_origen;

            }


            /* =============================================
               FECHA DEL ÚLTIMO ABONO
            ============================================= */

            if(pedido.fecha_abono){

                const fecha =
                    String(
                        pedido.fecha_abono
                    ).split("T")[0];


                if(
                    !grupo.fecha_abono ||
                    fecha >
                    grupo.fecha_abono
                ){

                    grupo.fecha_abono =
                        fecha;

                }

            }


            /* =============================================
               FECHA ARCHIVADO MÁS RECIENTE
            ============================================= */

            if(
                pedido.fecha_archivado
            ){

                const fechaArchivado =
                    String(
                        pedido.fecha_archivado
                    ).split("T")[0];


                if(
                    !grupo.fecha_archivado ||
                    fechaArchivado >
                    grupo.fecha_archivado
                ){

                    grupo.fecha_archivado =
                        fechaArchivado;

                }

            }

        });


        mostrarArchivados();


    }catch(error){

        console.error(
            "Error cargando pedidos archivados:",
            error
        );

    }

}

/* =========================================================
   MOSTRAR ARCHIVADOS
========================================================= */

function mostrarArchivados(){

    if(
        clienteArchivadoSeleccionado
    ){

        mostrarFacturasArchivadasCliente(
            clienteArchivadoSeleccionado
        );

        return;

    }


    mostrarListaClientesArchivados();

}
function obtenerClientesArchivadosFiltrados(){

    const buscar =
        document.getElementById(
            "buscar"
        );

    const valor =
        buscar
            ? buscar.value
                .toLowerCase()
                .trim()
            : "";


    return Object.values(
        archivadosPorCliente
    )
    .filter(
        cliente => {

            const nombreCompleto =
                `${cliente.nombre} ${cliente.apellido}`
                .toLowerCase();

            return nombreCompleto.includes(
                valor
            );

        }
    )
    .sort(
        (a, b) => {
            const facturasA = Object.values(a.grupos)
                .map(grupo => Number(grupo.numero_factura))
                .filter(numero => Number.isFinite(numero) && numero > 0);

            const facturasB = Object.values(b.grupos)
                .map(grupo => Number(grupo.numero_factura))
                .filter(numero => Number.isFinite(numero) && numero > 0);

            const facturaA = facturasA.length ? Math.min(...facturasA) : Number.MAX_SAFE_INTEGER;
            const facturaB = facturasB.length ? Math.min(...facturasB) : Number.MAX_SAFE_INTEGER;

            return facturaA - facturaB;
        }
    );

}
function actualizarPaginacionArchivados(){

    const clientes =
        obtenerClientesArchivadosFiltrados();

    const totalClientes =
        clientes.length;

    const totalPaginas =
        Math.ceil(
            totalClientes /
            clientesPorPaginaArchivados
        );


    if(
        totalPaginas > 0 &&
        paginaActualArchivados > totalPaginas
    ){
        paginaActualArchivados =
            totalPaginas;
    }


    const inicio =
        totalClientes === 0
            ? 0
            : (
                (paginaActualArchivados - 1) *
                clientesPorPaginaArchivados
              ) + 1;


    const fin =
        Math.min(
            paginaActualArchivados *
            clientesPorPaginaArchivados,
            totalClientes
        );


    const texto =
        document.getElementById(
            "textoPaginacionArchivados"
        );

    const anterior =
        document.getElementById(
            "btnAnteriorArchivados"
        );

    const siguiente =
        document.getElementById(
            "btnSiguienteArchivados"
        );


    if(texto){

        texto.textContent =
            `${inicio} - ${fin} de ${totalClientes}`;

    }


    if(anterior){

        anterior.style.display =
            paginaActualArchivados > 1
                ? "inline-block"
                : "none";

    }


    if(siguiente){

        siguiente.style.display =
            paginaActualArchivados < totalPaginas
                ? "inline-block"
                : "none";

    }

}


function paginaAnteriorArchivados(){

    if(paginaActualArchivados <= 1){
        return;
    }

    paginaActualArchivados--;

    mostrarListaClientesArchivados();

}
function paginaSiguienteArchivados(){

    const clientes =
        obtenerClientesArchivadosFiltrados();

    const totalClientes =
        clientes.length;

    const totalPaginas =
        Math.ceil(
            totalClientes /
            clientesPorPaginaArchivados
        );

    if(
        paginaActualArchivados >=
        totalPaginas
    ){
        return;
    }

    paginaActualArchivados++;

    mostrarListaClientesArchivados();

}

/* =========================================================
   ABRIR CLIENTE ARCHIVADO
========================================================= */

function toggleClienteArchivado(
    idUsuario
){

    const modal =
        document.getElementById(
            "modalDetalleArchivado"
        );

    const contenidoModal =
        document.getElementById(
            "contenidoModalDetalleArchivado"
        );

    if(
        !modal ||
        !contenidoModal
    ){
        return;
    }

    const clientes =
        obtenerClientesArchivadosFiltrados();

    const cliente =
        clientes.find(
            c =>
                Number(c.id_usuario) ===
                Number(idUsuario)
        );

    if(!cliente){
        return;
    }

    contenidoModal.innerHTML = "";

    modal.dataset.clienteId =
        String(idUsuario);

    modal.classList.add(
        "abierto"
    );

    mostrarFacturasArchivadasCliente(
        idUsuario,
        true
    );

}



/* =========================================================
   EXPANDIR / COLAPSAR TODOS LOS CLIENTES ARCHIVADOS
========================================================= */

function toggleTodosClientesArchivados(){

    const boton =
        document.getElementById(
            "btnExpandir"
        );

    const botonMovil =
        document.getElementById(
            "btnExpandirMovil"
        );

    const filasDetalle =
        document.querySelectorAll(
            '[id^="detalle-cliente-archivado-"]'
        );


    /* Saber si actualmente toca expandir o colapsar */

    const textoActual =
        boton
            ? boton.textContent.trim()
            : botonMovil
                ? botonMovil.textContent.trim()
                : "Expandir";


    const abrirTodos =
        textoActual === "Expandir";


    filasDetalle.forEach(
        fila => {

            const idUsuario =
                fila.id.replace(
                    "detalle-cliente-archivado-",
                    ""
                );

            const flecha =
                document.getElementById(
                    `flecha-archivado-${idUsuario}`
                );


            if(abrirTodos){

                fila.style.display =
                    "table-row";

                if(flecha){

                    flecha.textContent =
                        "▼";

                }


                mostrarFacturasArchivadasCliente(
                    Number(idUsuario),
                    true
                );


            }else{

                fila.style.display =
                    "none";


                if(flecha){

                    flecha.textContent =
                        "▶";

                }

            }

        }
    );


    /* Cambiar texto de ambos botones */

    const textoBoton =
        abrirTodos
            ? "Colapsar"
            : "Expandir";


    if(boton){

        boton.textContent =
            textoBoton;

    }


    if(botonMovil){

        botonMovil.textContent =
            textoBoton;

    }

}

/* =========================================================
   BUSCADOR
========================================================= */

function filtrar(){

    paginaActualArchivados = 1;

    mostrarListaClientesArchivados();

}

// ======================================================
// 🔹 ABRIR MODAL PARA DESARCHIVAR
// ======================================================

function desarchivarFactura(
    idUsuario,
    grupoCompra
){

    clienteParaDesarchivar =
        Number(idUsuario);

    grupoParaDesarchivar =
        Number(grupoCompra);


    document.getElementById(
        "modalDesarchivar"
    ).classList.add(
        "activo"
    );

}


// ======================================================
// 🔹 CERRAR MODAL DESARCHIVAR
// ======================================================

function cerrarModalDesarchivar(){

    clienteParaDesarchivar =
        null;

    grupoParaDesarchivar =
        null;


    document.getElementById(
        "modalDesarchivar"
    ).classList.remove(
        "activo"
    );

}


// ======================================================
// 🔹 CONFIRMAR DESARCHIVAR
// ======================================================

async function confirmarDesarchivar(){

    if(
        !clienteParaDesarchivar ||
        !grupoParaDesarchivar
    ){
        return;
    }


    const idUsuario =
        clienteParaDesarchivar;

    const grupoCompra =
        grupoParaDesarchivar;


    try{

        const respuesta =
            await fetch(
                "/unarchive-client-orders",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        id_usuario:
                            idUsuario,

                        grupo_compra:
                            grupoCompra
                    })
                }
            );


        const resultado =
            await respuesta.json();


        if(
            !respuesta.ok ||
            !resultado.ok
        ){

            console.error(
                resultado.mensaje ||
                "No se pudo desarchivar la factura."
            );

            return;
        }


        // Cerrar confirmación de desarchivar
        cerrarModalDesarchivar();

        // Cerrar también el modal grande del pedido archivado
        

        // Actualizar inmediatamente la lista de Archivados
        await cargarArchivados();

        const clienteActualizado =
            archivadosPorCliente[Number(idUsuario)];

        if (
            clienteActualizado &&
            (
                Object.keys(clienteActualizado.grupos || {}).length > 0 ||
                (clienteActualizado.pedidos || []).length > 0
            )
        ) {
            mostrarFacturasArchivadasCliente(
                Number(idUsuario),
                true
            );
        } else {
            cerrarModalDetalleArchivado();
        }

        // Mostrar confirmación al usuario
        mostrarMensaje(
            "Su factura fue desarchivada correctamente",
            "exito"
        );


    }catch(error){

        console.error(
            "Error desarchivando factura:",
            error
        );

    }

}
/* =========================================================
   DETALLES ARCHIVADOS
========================================================= */

function verDetallesArchivados(
    idUsuario,
    grupoCompra
){

    const idCliente =
        Number(
            idUsuario
        );

    const idGrupo =
        Number(
            grupoCompra
        );


    if(
        !Number.isInteger(idCliente) ||
        idCliente <= 0
    ){

        return;

    }


    if(
        !Number.isInteger(idGrupo) ||
        idGrupo <= 0
    ){

        return;

    }


    window.location.href =
        `/details.html?id=${encodeURIComponent(idCliente)}&grupo=${encodeURIComponent(idGrupo)}&archivado=1`;

}

/* =========================================================
   ABRIR MODAL ELIMINAR
========================================================= */

function abrirEliminarArchivado(
    idUsuario,
    grupoCompra,
    idPedido = null
){

    const cliente =
        archivadosPorCliente[
            Number(idUsuario)
        ];


    if(!cliente){
        return;
    }


    clienteArchivadoParaEliminar =
        Number(idUsuario);


    grupoArchivadoParaEliminar =
        grupoCompra !== null &&
        grupoCompra !== undefined
            ? Number(grupoCompra)
            : null;


    pedidoArchivadoParaEliminar =
        idPedido !== null &&
        idPedido !== undefined
            ? Number(idPedido)
            : null;


    let mensaje = "";


    /*
        =====================================================
        FACTURA NORMAL
        =====================================================
    */

    if(
        grupoArchivadoParaEliminar
    ){

        mensaje =
            `¿Desea eliminar definitivamente esta factura archivada de ${cliente.nombre} ${cliente.apellido}? Se eliminarán todos los pedidos y abonos ligados a esta factura.`;

    }


    /*
        =====================================================
        PEDIDO ANTIGUO SIN FACTURA
        =====================================================
    */

    else if(
        pedidoArchivadoParaEliminar
    ){

        mensaje =
            `¿Desea eliminar definitivamente este pedido antiguo archivado de ${cliente.nombre} ${cliente.apellido}?`;

    }


    else{

        return;

    }


    document.getElementById(
        "mensajeEliminarArchivado"
    ).textContent =
        mensaje;


    document.getElementById(
        "modalEliminarArchivado"
    ).style.display =
        "flex";

}


/* =========================================================
   CANCELAR ELIMINACIÓN
========================================================= */

function cancelarEliminarArchivado(){

    clienteArchivadoParaEliminar =
        null;


    grupoArchivadoParaEliminar =
        null;


    pedidoArchivadoParaEliminar =
        null;


    document.getElementById(
        "modalEliminarArchivado"
    ).style.display =
        "none";

}

/* =========================================================
   CONFIRMAR ELIMINACIÓN
========================================================= */

async function confirmarEliminarArchivado(){

    if(
        !clienteArchivadoParaEliminar
    ){
        return;
    }


    const idUsuario =
        clienteArchivadoParaEliminar;


    try{

        const datosEliminar = {
            id_usuario:
                idUsuario
        };


        /*
            Si estamos eliminando una factura normal,
            mandamos grupo_compra.
        */

        if(
            grupoArchivadoParaEliminar !== null &&
            grupoArchivadoParaEliminar !== undefined
        ){

            datosEliminar.grupo_compra =
                grupoArchivadoParaEliminar;

        }


        /*
            Si después usamos esta misma lógica para
            un pedido antiguo sin factura, también
            podremos mandar id_pedido.
        */

        if(
            typeof pedidoArchivadoParaEliminar !== "undefined" &&
            pedidoArchivadoParaEliminar !== null
        ){

            datosEliminar.id_pedido =
                pedidoArchivadoParaEliminar;

        }


        const respuesta =
            await fetch(
                "/delete-archived-client-orders",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(
                        datosEliminar
                    )
                }
            );


        const resultado =
            await respuesta.json();


        if(
            !respuesta.ok ||
            !resultado.ok
        ){

            console.error(
                resultado.mensaje ||
                "No se pudo eliminar el archivado"
            );

            return;

        }


        // Cerrar confirmación de eliminar
        cancelarEliminarArchivado();

        // Cerrar también el modal grande del pedido archivado
        

        // Actualizar inmediatamente la lista de Archivados
        await cargarArchivados();

        const clienteActualizado =
            archivadosPorCliente[Number(idUsuario)];

        if (
            clienteActualizado &&
            (
                Object.keys(clienteActualizado.grupos || {}).length > 0 ||
                (clienteActualizado.pedidos || []).length > 0
            )
        ) {
            mostrarFacturasArchivadasCliente(
                Number(idUsuario),
                true
            );
        } else {
            cerrarModalDetalleArchivado();
        }

        // Mostrar confirmación al usuario
        mostrarMensaje(
            "Su factura fue eliminada correctamente",
            "exito"
        );


    }catch(error){

        console.error(
            "Error eliminando archivado:",
            error
        );

    }

}


/* =========================================================
   INICIAR
========================================================= */

async function iniciarArchivados(){

    await cargarArchivados();


    const parametrosURL =
        new URLSearchParams(
            window.location.search
        );


    const idClienteURL =
        Number(
            parametrosURL.get("id")
        );


    if(
        Number.isInteger(idClienteURL) &&
        idClienteURL > 0 &&
        archivadosPorCliente[idClienteURL]
    ){

        const clientes =
            obtenerClientesArchivadosFiltrados();


        const indice =
            clientes.findIndex(
                cliente =>
                    Number(
                        cliente.id_usuario
                    ) ===
                    idClienteURL
            );


        if(indice !== -1){

            paginaActualArchivados =
                Math.floor(
                    indice /
                    clientesPorPaginaArchivados
                ) + 1;


            mostrarListaClientesArchivados();


            setTimeout(
                () => {

                    toggleClienteArchivado(
                        idClienteURL
                    );

                },
                0
            );

        }


        window.history.replaceState(
            {},
            "",
            "/archived_orders.html"
        );

    }

}



iniciarArchivados();

<script>
function cerrarModalDetalleArchivado(){

    const modal =
        document.getElementById("modalDetalleArchivado");

    const contenido =
        document.getElementById("contenidoModalDetalleArchivado");

    if(!modal) return;

    const idUsuario =
        modal.dataset.clienteId;

    if(idUsuario){

        const flecha =
            document.getElementById(
                `flecha-archivado-${idUsuario}`
            );

        if(flecha){
            flecha.textContent = "▶";
        }

    modal.classList.remove("abierto");

    if(contenido){
        contenido.innerHTML = "";

    delete modal.dataset.clienteId;

<script>
function mostrarMensaje(texto, tipo){

    const anterior =
        document.getElementById("mensajeArchivadosFlotante");

    if(anterior){
        anterior.remove();
    }

    const mensaje =
        document.createElement("div");

    mensaje.id =
        "mensajeArchivadosFlotante";

    mensaje.textContent =
        texto;

    mensaje.style.position =
        "fixed";

    mensaje.style.top =
        "20px";

    mensaje.style.left =
        "50%";

    mensaje.style.transform =
        "translateX(-50%)";

    mensaje.style.zIndex =
        "10000";

    mensaje.style.padding =
        "13px 22px";

    mensaje.style.borderRadius =
        "8px";

    mensaje.style.color =
        "#ffffff";

    mensaje.style.fontWeight =
        "600";

    mensaje.style.fontSize =
        "15px";

    mensaje.style.boxShadow =
        "0 4px 14px rgba(0,0,0,0.20)";

    mensaje.style.background =
        tipo === "exito"
            ? "#28a745"
            : "#d62828";

    document.body.appendChild(
        mensaje
    );

    setTimeout(() => {

        if(mensaje.parentNode){
            mensaje.remove();
        }

    }, 3000);
}
</script>
