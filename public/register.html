<!DOCTYPE html>
<html lang="es">

<head>
 <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta charset="UTF-8">

    <title>Registro</title>

    <style>

        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background: linear-gradient(to right, #f8e1e7, #fdf6f0);

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            margin: 0;

        }


        .container {

            background: white;

            color: #333;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 6px 15px rgba(0,0,0,0.2);

            width: 400px;

            text-align: center;

        }


        /* 🔥 TÍTULO + LOGO EN LÍNEA */

        .titulo {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            margin-bottom: 20px;

        }


        .titulo h2 {

            margin: 0;

            color: #c48b9f;

        }


        .titulo img {

            width: 70px;

        }


        input,
        select {

            display: block;

            margin: 10px auto;

            padding: 12px;

            width: 90%;

            border-radius: 8px;

            border: 1px solid #ddd;

            font-size: 14px;

            transition: 0.3s;

            box-sizing: border-box;

        }


        input:focus,
        select:focus {

            border-color: #c48b9f;

            box-shadow: 0 0 6px rgba(196,139,159,0.5);

            outline: none;

        }
/* ========================================
   CAMPO CONTRASEÑA + OJO
======================================== */

.password-container {

    position: relative;

    width: 90%;

    margin: 10px auto;

}


.password-container input {

    width: 100%;

    margin: 0;

    padding-right: 48px;

}


.toggle-password {

    position: absolute;

    top: 50%;

    right: 10px;

    transform: translateY(-50%);

    width: 38px;

    height: 38px;

    margin: 0;

    padding: 0;

    border: none;

    background: transparent;

    color: #777;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

}


.toggle-password:hover {

    background: transparent;

    color: #c7547d;

}


.toggle-password:focus {

    outline: none;

}

        /* ========================================
           🔐 REQUISITOS DE CONTRASEÑA
        ======================================== */

        #passwordRequisitos {

            display: none;

            width: 90%;

            margin: -2px auto 10px auto;

            text-align: left;

            color: #c62828;

            font-size: 13px;

            line-height: 1.4;

        }


        .botones {

            margin-top: 20px;

        }

button {

    padding: 12px 20px;

    border: none;

    border-radius: 8px;

    background: #c7547d;

    color: white;

    font-weight: bold;

    cursor: pointer;

    margin: 5px;

    width: 140px;

    transition:
        background-color 0.2s ease,
        transform 0.2s ease;

}


button:hover {

    background: #b94770;

}


.cancelar {

    background: #e74c4c;

}


.cancelar:hover {

    background: #d94343;

}

/* ========================================
   MENSAJE DE VALIDACIÓN DE CAMPOS
======================================== */

#mensajeValidacion {

    display: none;

    width: 90%;

    margin: 0 auto 12px auto;

    padding: 10px 12px;

    box-sizing: border-box;

    border-radius: 7px;

    background: #ffebee;

    border: 1px solid #ef9a9a;

    color: #c62828;

    font-size: 13px;

    font-weight: 600;

}


        /* ========================================
           🔹 MENSAJE DE REGISTRO
        ======================================== */

        #mensaje {

            display: none;

            margin-top: 20px;

            padding: 13px 15px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.5;

        }


        #mensaje.exito {

            display: block;

            color: #2e7d32;

            background-color: #e8f5e9;

            border: 1px solid #a5d6a7;

        }


        #mensaje.error {

            display: block;

            color: #c62828;

            background-color: #ffebee;

            border: 1px solid #ef9a9a;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- 🔥 TÍTULO CON LOGO -->

    <div class="titulo">

        <h2>🧾 Registro Completo</h2>

        <img src="logo.jpg" alt="Logo">

    </div>


    <form id="formRegistro">


    <!-- MENSAJE DE VALIDACIÓN -->
    <div id="mensajeValidacion"></div>


    <input
        type="text"
        id="nombre"
        placeholder="👤 Nombre"
        autocomplete="given-name"
        required
    >


    <input
        type="text"
        id="apellido"
        placeholder="👤 Apellido"
        autocomplete="family-name"
        required
    >


    <input
        type="text"
        id="telefono"
        placeholder="📞 Teléfono"
        inputmode="numeric"
        autocomplete="tel"
        required
    >


    <input
        type="email"
        id="correo"
        placeholder="📧 Correo"
        required
    >

<div class="password-container">

    <input
        type="password"
        id="password"
        placeholder="🔑 Contraseña"
        minlength="8"
        required
    >

    <button
        type="button"
        class="toggle-password"
        onclick="togglePassword()"
        aria-label="Mostrar u ocultar contraseña"
    >

        <svg
            id="iconoOjo"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>

    </button>

</div>


        <!-- 🔐 MENSAJE DE REQUISITOS -->

        <div id="passwordRequisitos">
            ⚠️ La contraseña debe tener mínimo 8 caracteres,
            al menos una letra y un número.
        </div>


        <select id="provincia" required>

            <option value="">
                🌍 Seleccione provincia
            </option>

            <option value="San José">
                San José
            </option>

            <option value="Alajuela">
                Alajuela
            </option>

            <option value="Cartago">
                Cartago
            </option>

            <option value="Heredia">
                Heredia
            </option>

            <option value="Guanacaste">
                Guanacaste
            </option>

            <option value="Puntarenas">
                Puntarenas
            </option>

            <option value="Limón">
                Limón
            </option>

        </select>


        <select
    id="canton"
    required
    disabled
>

    <option value="">
        🏙️ Seleccione cantón
    </option>

</select>

<select
    id="distrito"
    required
    disabled
>

    <option value="">
        📍 Seleccione distrito
    </option>

</select>


        <input
            type="text"
            id="direccion"
            placeholder="🏠 Dirección exacta"
            required
        >


        <div class="botones">

            <button type="submit">
                Registrarse
            </button>


            <button
                type="button"
                class="cancelar"
                onclick="cancelar()"
            >
                Cancelar
            </button>

        </div>


    </form>


    <div id="mensaje"></div>


</div>

<script src="ubicaciones-cr.js"></script>

<script>

// ========================================
// CONTRASEÑA + OJO
// ========================================

const passwordInput =
    document.getElementById(
        "password"
    );

const passwordRequisitos =
    document.getElementById(
        "passwordRequisitos"
    );


function validarPassword(password){

    const tieneLongitud =
        password.length >= 8;

    const tieneLetra =
        /[A-Za-z]/.test(password);

    const tieneNumero =
        /\d/.test(password);

    return (
        tieneLongitud &&
        tieneLetra &&
        tieneNumero
    );

}


function togglePassword(){

    if(
        passwordInput.type ===
        "password"
    ){

        passwordInput.type =
            "text";

    }else{

        passwordInput.type =
            "password";

    }

}


passwordInput.addEventListener(
    "input",
    () => {

        const password =
            passwordInput.value;

        if(password.length === 0){

            passwordRequisitos.style.display =
                "none";

            return;

        }

        if(!validarPassword(password)){

            passwordRequisitos.style.display =
                "block";

        }else{

            passwordRequisitos.style.display =
                "none";

        }

    }
);

// ========================================
// VALIDAR NOMBRE, APELLIDO Y TELÉFONO
// ========================================

const nombreInput =
    document.getElementById("nombre");

const apellidoInput =
    document.getElementById("apellido");

const telefonoInput =
    document.getElementById("telefono");


function mostrarMensajeCampo(texto){

    const mensaje =
        document.getElementById(
            "mensajeValidacion"
        );

    mensaje.textContent =
        texto;

    mensaje.style.display =
        "block";

}


function ocultarMensajeCampo(){

    const mensaje =
        document.getElementById(
            "mensajeValidacion"
        );

    mensaje.textContent =
        "";

    mensaje.style.display =
        "none";

}


function soloLetras(valor){

    return /^[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s'-]*$/.test(
        valor
    );

}


function soloNumeros(valor){

    return /^\d*$/.test(
        valor
    );

}


nombreInput.addEventListener(
    "input",
    function(){

        if(!soloLetras(this.value)){

            mostrarMensajeCampo(
                "En el nombre solo se permiten letras."
            );

        }else{

            ocultarMensajeCampo();

        }

    }
);


apellidoInput.addEventListener(
    "input",
    function(){

        if(!soloLetras(this.value)){

            mostrarMensajeCampo(
                "En el apellido solo se permiten letras."
            );

        }else{

            ocultarMensajeCampo();

        }

    }
);


telefonoInput.addEventListener(
    "input",
    function(){

        if(!soloNumeros(this.value)){

            mostrarMensajeCampo(
                "En el teléfono solo se permiten números."
            );

        }else{

            ocultarMensajeCampo();

        }

    }
);
// ========================================
// 🔹 REGISTRAR USUARIO
// ========================================

document
.getElementById('formRegistro')
.addEventListener(
    'submit',
    async (e) => {

        e.preventDefault();

        const nombre =
    document.getElementById(
        "nombre"
    ).value.trim();

const apellido =
    document.getElementById(
        "apellido"
    ).value.trim();

const telefono =
    document.getElementById(
        "telefono"
    ).value.trim();


if(!soloLetras(nombre)){

    mostrarMensajeCampo(
        "En el nombre solo se permiten letras."
    );

    nombreInput.focus();

    return;

}


if(!soloLetras(apellido)){

    mostrarMensajeCampo(
        "En el apellido solo se permiten letras."
    );

    apellidoInput.focus();

    return;

}


if(!soloNumeros(telefono)){

    mostrarMensajeCampo(
        "En el teléfono solo se permiten números."
    );

    telefonoInput.focus();

    return;

}


        const password =
            document.getElementById('password').value;


        // ========================================
        // 🔐 COMPROBAR CONTRASEÑA ANTES DE ENVIAR
        // ========================================

        if (!validarPassword(password)) {

            passwordRequisitos.style.display =
                "block";

            passwordInput.focus();

            return;
        }


        const data = {

            nombre:
                document.getElementById('nombre').value,

            apellido:
                document.getElementById('apellido').value,

            telefono:
                document.getElementById('telefono').value,

            correo:
                document.getElementById('correo').value,

            password:
                password,

            provincia:
                document.getElementById('provincia').value,

            canton:
                document.getElementById('canton').value,

            distrito:
                document.getElementById('distrito').value,

            direccion_exacta:
                document.getElementById('direccion').value

        };


        const mensaje =
            document.getElementById("mensaje");


        try {


            const res =
                await fetch(
                    '/register',
                    {

                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body:
                            JSON.stringify(data)

                    }
                );



            // ========================================
            // 🔹 REGISTRO EXITOSO
            // ========================================

            if(res.ok){


                mensaje.className =
                    "exito";


                mensaje.innerHTML = `
                    ✅ Registro guardado correctamente.<br>
                    Serás enviado al inicio de sesión.
                `;


                // Limpiar formulario

                document
                    .getElementById(
                        "formRegistro"
                    )
                    .reset();


                passwordRequisitos.style.display =
                    "none";



                // Esperar 3 segundos antes de ir al login

                setTimeout(
                    () => {

                        window.location.href =
                            "/login.html";

                    },
                    3000
                );


            }else{


                // ========================================
                // 🔹 ERROR DEL SERVIDOR
                // ========================================

                const textoError =
                await res.text();

                mensaje.className =
                    "error";


                mensaje.innerText =
                    "❌ " + (
                   textoError ||
                "No se pudo realizar el registro."  );
            


            }


        }catch(error){


            console.error(
                "Error registrando usuario:",
                error
            );


            mensaje.className =
                "error";


            mensaje.innerText =
                "❌ Error de conexión. Inténtalo nuevamente.";


        }


    }
);



// ========================================
// 🔹 CANCELAR
// ========================================

function cancelar(){

    window.location.href =
        "/";

}


</script>


</body>

</html>
