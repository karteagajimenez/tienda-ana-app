<!DOCTYPE html> 
<html lang="es"> 
 
<head> 
 
<link rel="icon" type="image/png" href="/favicon.png">

<meta charset="UTF-8"> 
 
<title>Agregar artículo - Tienda Ana</title> 
 
<style> 
 
body{ 
    font-family:Arial, sans-serif; 
    background:linear-gradient(to right,#f8e1e7,#fdf6f0); 
    margin:0; 
    padding:0; 
} 
 
 
/* HEADER */ 
 
.header{ 
    display:flex; 
    align-items:center; 
    justify-content:space-between; 
    padding:15px 25px; 
    position:relative; 
} 
 
.header h1{ 
    font-size:22px; 
    color:#c48b9f; 
    margin:0; 
} 
 
.logo-container{ 
    position:absolute; 
    left:50%; 
    transform:translateX(-50%); 
} 
 
.logo-header{ 
    height:90px; 
} 
 
 
/* CONTENEDOR */ 
 
.contenedor{ 
    width:90%; 
    max-width:650px; 
    margin:40px auto; 
} 
 
.tarjeta{ 
    background:white; 
    padding:35px; 
    border-radius:10px; 
    box-shadow:0 3px 15px rgba(0,0,0,0.12); 
} 
 
.tarjeta h2{ 
    color:#c48b9f; 
    margin-top:0; 
    margin-bottom:25px; 
    text-align:center; 
} 
 
 
/* CAMPOS */ 
 
.campo{ 
    margin-bottom:20px; 
} 
 
.campo label{ 
    display:block; 
    margin-bottom:7px; 
    font-weight:bold; 
    color:#555; 
} 
 
.campo input, 
.campo textarea{ 
    width:100%; 
    box-sizing:border-box; 
    padding:12px; 
    border:1px solid #ddd; 
    border-radius:6px; 
    font-size:15px; 
    font-family:Arial, sans-serif; 
} 
 
.campo textarea{ 
    min-height:120px; 
    resize:vertical; 
} 
 
.campo input:focus, 
.campo textarea:focus{ 
    outline:none; 
    border-color:#c48b9f; 
} 
 
 
/* BOTONES */ 
 
.botones{ 
    display:flex; 
    justify-content:flex-end; 
    gap:10px; 
    margin-top:25px; 
} 
 
button{ 
    border:none; 
    padding:11px 18px; 
    border-radius:6px; 
    cursor:pointer; 
    font-weight:bold; 
} 
 
.volver{ 
    background:#b76e8a; 
    color:white; 
}

/* BOTÓN DETALLES */
.detalles{
    background:#c48b9f;
    color:white;
}
 
.agregar{ 
    background:#2ecc71; 
    color:white; 
} 
 
button:hover{ 
    opacity:0.85; 
} 
 
 
/* TOAST */ 
 
.toast{ 
    position:fixed; 
    top:20px; 
    left:50%; 
    transform:translateX(-50%); 
    background:#2ecc71; 
    color:white; 
    padding:12px 22px; 
    border-radius:7px; 
    font-weight:bold; 
    display:none; 
    z-index:9999; 
    box-shadow:0 3px 10px rgba(0,0,0,0.2); 
} 
 
.toast.error{ 
    background:#e74c3c; 
} 
 
 
/* RESPONSIVE */ 
 
@media(max-width:700px){ 
 
    .header h1{ 
        display:none; 
    } 
 
    .logo-container{ 
        position:static; 
        transform:none; 
    } 
 
    .tarjeta{ 
        padding:25px; 
    } 
 
} 
 
</style> 
 
</head> 
 
 
<body> 
 
 
<div 
    id="toast" 
    class="toast" 
></div> 
 
 
<div class="header"> 
 
    <h1> 
        📦 Agregar artículo 
    </h1> 
 
    <div class="logo-container"> 
 
        <img 
            src="logo.jpg" 
            class="logo-header" 
            alt="Tienda Ana" 
        > 
 
    </div> 
 
</div> 
 
 
 
<div class="contenedor"> 
 
    <div class="tarjeta"> 
 
        <h2> 
            Nuevo artículo 
        </h2> 
 
 
        <form id="formArticulo"> 
 
 
            <div class="campo"> 
 
                <label for="nombre"> 
                    Nombre del artículo 
                </label> 
 
                <input 
                    type="text" 
                    id="nombre" 
                    placeholder="Ejemplo: Plancha Baby Liss PRO" 
                    required 
                > 
 
            </div> 
 
 
            <div class="campo"> 
 
                <label for="tasa"> 
                    Tasa 
                </label> 
 
                <input 
                    type="number" 
                    id="tasa" 
                    placeholder="Precio del artículo" 
                    min="0" 
                    step="0.01" 
                    required 
                > 
 
            </div> 
 
 
            <div class="campo"> 
 
                <label for="descripcion"> 
                    Descripción 
                </label> 
 
                <textarea 
                    id="descripcion" 
                    placeholder="Ejemplo: 1 pulgada / 25 mm" 
                ></textarea> 
 
            </div> 
 
 
            <div class="botones"> 
 
                <button 
                    type="button" 
                    class="volver" 
                    onclick="volver()" 
                > 
                    Volver 
                </button>


                <button
                    type="button"
                    class="detalles"
                    onclick="verDetalles()"
                >
                    Detalles
                </button>
 
 
                <button 
                    type="submit" 
                    class="agregar" 
                > 
                    Agregar 
                </button> 
 
            </div> 
 
 
        </form> 
 
    </div> 
 
</div> 
 
 
 
<script> 
 
 
function mostrarToast( 
    mensaje, 
    error = false 
){ 
 
    const toast = 
        document.getElementById( 
            "toast" 
        ); 
 
    toast.innerText = 
        mensaje; 
 
    toast.className = 
        error 
            ? "toast error" 
            : "toast"; 
 
    toast.style.display = 
        "block"; 
 
 
    setTimeout( 
        () => { 
 
            toast.style.display = 
                "none"; 
 
        }, 
        3000 
    ); 
 
} 
 
 
 
function volver(){ 
 
    window.location.href = 
        "/dashboard.html"; 
 
}


/* ABRIR LISTA DE ARTÍCULOS */
function verDetalles(){

    window.location.href =
        "/articles.html";

}
 
 
 
document.getElementById( 
    "formArticulo" 
).addEventListener( 
    "submit", 
    async function(event){ 
 
        event.preventDefault(); 
 
 
        const nombre = 
            document.getElementById( 
                "nombre" 
            ).value.trim(); 
 
 
        const tasa = 
            document.getElementById( 
                "tasa" 
            ).value; 
 
 
        const descripcion = 
            document.getElementById( 
                "descripcion" 
            ).value.trim(); 
 
 
 
        if(!nombre){ 
 
            mostrarToast( 
                "Ingrese el nombre del artículo.", 
                true 
            ); 
 
            return; 
 
        } 
 
 
 
        try{ 
 
            const respuesta = 
                await fetch( 
                    "/create-article", 
                    { 
 
                        method:"POST", 
 
                        headers:{ 
                            "Content-Type": 
                                "application/json" 
                        }, 
 
                        body:JSON.stringify({ 
                            nombre, 
                            tasa, 
                            descripcion 
                        }) 
 
                    } 
                ); 
 
 
            const datos = 
                await respuesta.json(); 
 
 
 
            if(!respuesta.ok){ 
 
                mostrarToast( 
                    datos.mensaje || 
                    "No se pudo guardar el artículo.", 
                    true 
                ); 
 
                return; 
 
            } 
 
 
 
            mostrarToast( 
                "Artículo agregado correctamente." 
            ); 
 
 
            document.getElementById( 
                "formArticulo" 
            ).reset(); 
 
 
        }catch(error){ 
 
            console.error( 
                "Error guardando artículo:", 
                error
            ); 
 
            mostrarToast( 
                "Ocurrió un error guardando el artículo.", 
                true 
            ); 
 
        } 
 
    } 
); 
 
 
</script> 
 
 
</body> 
 
</html>
